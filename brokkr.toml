project = "mogwai"

# The default shape: every crate with no feature on. That is the SHIPPED shape
# and the one every consumer builds - `mogwai-data` and `mogwai-lab` each carry
# `hotpath`/`hotpath-alloc`, and both are optional dependencies precisely so
# that with neither feature named the profiler is absent from the dependency
# graph rather than merely inert.
[[check]]
name = "workspace"

# The instrumented shape. It exists because a feature nothing compiles is a
# feature that is broken and nobody knows: with `hotpath` off, every
# `cfg_attr(feature = "hotpath", hotpath::measure)` annotation and both
# `required-features` harness examples vanish from the build, so a rename, a
# moved function or a macro-argument change breaks nothing that any lane runs.
#
# `hotpath-alloc` rather than `hotpath` because it is the strict superset - it
# enables `hotpath` too, and additionally compiles the harnesses'
# `#[global_allocator]` declarations, which the timing-only feature does not.
# One sweep therefore covers both feature shapes' code.
#
# Scoped with `packages` because this is a virtual workspace: cargo rejects
# `--features` at the root, so the features have to be attributed to the crates
# that declare them.
[[check]]
name = "instrumented"
packages = ["mogwai-data", "mogwai-lab"]
features = ["hotpath-alloc"]

[test]
gate_profile = "gate"

# `brokkr check --gate` - the complete answer, and the only invocation that
# runs the adapter's socket-backed integration tests.
#
# Those four binaries (`adapter_smoke`, `data_client_transport`, `havoc`,
# `reconciliation`) are `#[ignore]`d because they bind real loopback listeners,
# which not every environment allows - a sandbox without sockets fails them for
# reasons that have nothing to do with the code. So plain `brokkr check` stays
# as it was: fast, sandbox-safe, and blind to them.
#
# That blindness has cost real bugs. The `account_id` field the multi-account
# landing added to `AccountState`, and the websocket URL that landing broke by
# appending the path after the query string, both shipped RED and stayed red
# across three commits, because the only tests that exercised them never ran.
# Each was found by hand. `include_ignored` here is what makes them a gate
# rather than a thing someone remembers to run.
#
# `certifies = "complete"` also turns on the coverage audit: any (build shape,
# test) pair no lane runs must be justified below or `#[ignore]`d at the
# source, so a test quietly dropping out of the run is an error rather than a
# silence.
# `include_ignored` pulls in two unrelated families, and only one of them is
# what this gate is for. The socket-backed tests are `#[ignore]`d for an
# ENVIRONMENT reason - they bind loopback listeners - and are fast, so the gate
# runs them. The six below are `#[ignore]`d for a COST reason: they are
# measurement instruments that walk millions of ticks, and every one of them
# outlives the 20-second per-test hang watchdog by design. Under
# `include_ignored` they do not report slow, they get killed and fail the gate,
# which is how `brokkr check --gate` came to be unrunnable in this workspace.
#
# Skipping them costs no coverage: the audit accepts a non-run pair that is
# `#[ignore]`d at the source, and each stays runnable by name, which is the
# documented way to use an instrument anyway -
# `brokkr test -p mogwai-server vol_probe` and its five siblings.
#
# THE INVARIANT every pattern below must satisfy: it may match ONLY tests that
# are `#[ignore]`d at the source. That is what makes skipping them free - the
# audit accepts a non-run pair that is ignored, because `include_ignored` is
# the only reason it was in scope at all. A pattern matching a non-ignored test
# silently stops running a real one, and the audit then fails it as orphaned
# rather than letting it disappear. That is not hypothetical: the `parity3a_`
# prefix did exactly this, and the audit caught it. Prefer full test names;
# a prefix is only safe while every test that shares it stays ignored, which
# is a property of files this file cannot see.
[test.profiles.gate]
description = "Everything, including the socket-backed adapter tests"
sweeps = ["workspace", "instrumented"]
include_ignored = true
# Serial, this gate took 3m01s: 164s of test execution, so the wall was the SUM
# of 1,608 tests rather than the longest of them. That is not a compute bill -
# the top 20 tests are 54% of it and most of them are WAITING, on a declared
# `--duration` or a reconnect ladder. At 8 the gate runs in about a minute with
# per-test times unmoved (the slowest tape walk went 7.622s to 7.768s), which is
# what says the tests are not starving each other.
#
# 16 is past the cliff. The one test that could not take parallelism at all is
# now `#[ignore]`d and skipped below; the rest of that story, and the work that
# would let this go higher, is the parallel item in `notes/todo.md`.
test_threads = 8
skip = [
    # THE DECLARED-DEADLINE FAMILY, parked for the parallel-safety item in
    # `notes/todo.md`. Each gives the venue a fixed `--duration` measured from
    # readiness and then bets that the client's connect beats it; under parallel
    # execution the connect can lose, so the run completes and closes before the
    # socket ever sees the frame, and the test fails on having not seen it. That
    # is a WRONG ANSWER rather than a timeout, which is why it reads like a real
    # regression. Expect this list to grow as the triage catches more - a fixed
    # wait is the defect, and these are the ones that have surfaced so far.
    # Both are `#[ignore]`d at the source too, per the invariant above, and both
    # run by name: `brokkr test -p mogwai-cli <name>`.
    "venue_announces_run_complete_and_exits_zero_at_the_declared_sim_deadline",
    "run_complete_reaches_every_open_socket",
    "vol_probe",
    # A RELEASE-profile wall-clock contract, excluded from this DEBUG lane
    # because that lane cannot validly evaluate it - not because the property
    # is being dropped. The test asserts a 50 ms p99 pacing bound; the debug
    # binary measures 106-330 ms for reasons that are about the build profile
    # rather than the code, so a red result here is not evidence about the
    # stated property, and running it anyway is itself a changed measuring
    # instrument. The 50 ms assertion is UNCHANGED and authoritative, the test
    # stays `#[ignore]`d and directly runnable
    # (`brokkr test -p mogwai-cli tape_lateness_under_acceleration`), and
    # `reference/performance.md` keeps the release result.
    #
    # Its environment sensitivity is REAL and unresolved: a release rerun on
    # 2026-08-08 failed at 311 ms p99 with a load average of 1.46 across 32
    # visible CPUs, so load average is not a sufficient admission test either.
    # That is open repository work: no admission test yet distinguishes a host
    # that can judge this budget from one that cannot. Excluding the test from a
    # lane that cannot judge it does not claim this host meets the budget.
    "tape_lateness_under_acceleration",
    "read_market_latency_stays_within_submit_budget",
    "dwell_is_bounded_across_run_seeds",
    "standardized_candidate_rail_sizing",
    "realized_return_envelope_under_regime_scaling",
    "synthetic_spread_decomposition_at_protocol_seven",
    # The protocol-12a parity gates (the retired rewrite plan, phase 2a):
    # one reads the multi-GB delivered July corpus, the eight seed gates each
    # run a month-long walk. Minutes apiece, far past the per-test ceiling, and
    # both need artifacts that only exist on a machine holding the delivery.
    # Run them by name: `brokkr test -p mogwai-cli parity12a_observed
    # --timeout 279` and `... parity12a_generated_seed_N --timeout 279`.
    "parity12a_",
    # The 12b brick E envelope gates, both `#[ignore]`d at the source for a
    # COST reason: the closed-form conformance cross-check walks 12 cells by
    # 2,000 simulated exposures (spec ceiling 900 s), and the fidelity gate
    # runs 32 real candidate walks against 32 idealized months per probe cell
    # at two grid steps. Both outlive the 20-second watchdog by design. Run
    # them by name:
    # `brokkr test -p mogwai-lab the_envelope_matches_the_closed_forms_where_they_are_exact --timeout 279`
    # `brokkr test -p mogwai-lab the_envelope_simulator_is_faithful_to_the_candidate_walks --timeout 279`.
    "the_envelope_matches_the_closed_forms_where_they_are_exact",
    "the_envelope_simulator_is_faithful_to_the_candidate_walks",
    # Protocol 12b brick N3's two pins, both `#[ignore]`d at the source and
    # both unrunnable in this lane for reasons the lane cannot fix.
    #
    # The exposure pin holds the two copies of the 12b section 8 exposure
    # contract equal - `mogwai_lab::arrival_control::control_generated_pass`
    # and `mogwai_cli::measure::run_final_walk`, which must be two because the
    # lab cannot depend on the CLI. It runs a month-long walk on each side,
    # like its `parity12a_` neighbours above, so it is minutes past the
    # watchdog. Run it by name: `brokkr test -p mogwai-cli
    # the_lab_walk_matches_the_measure_exposure_contract --timeout 279`.
    #
    # The re-attestation pin is fast - roughly a second at its shortened
    # window - but it is excluded for an ENVIRONMENT reason rather than a cost
    # one: it asserts that a tree which moves mid-run leaves the artifact
    # unwritten, so it needs a CLEAN tree to get past the run's own first step,
    # and it deliberately dirties the tree while it is in flight. Neither is
    # acceptable inside a general check lane. Run it by name from a committed
    # tree: `brokkr test -p mogwai-cli
    # arrival_control_refuses_a_tree_that_changed_during_the_run`.
    "the_lab_walk_matches_the_measure_exposure_contract",
    "arrival_control_refuses_a_tree_that_changed_during_the_run",
    # Protocol 12b brick A's blocking projection oracle runs eight committed
    # month-scale walks. It is invoked deliberately with the extended timeout
    # named by its implementation spec.
    "arrival_screen_layer1_reproduces_the_committed_12a_generated_blocks",
    # Phase 3a/3b parity gates: the cadence gate streams three multi-GB
    # Binance archives, the 3b fit gate reads the delivered July corpus and
    # the Python-era walk cache, and the session-profile gate needs the NQ
    # one-minute archive. All need local data no clone carries. Run them by
    # name: `brokkr test -p mogwai-cli parity3b --timeout 279` and
    # `brokkr test -p mogwai-lab parity3b_session_profile`.
    #
    # The 3a pair is named in full rather than skipped by `parity3a_` prefix.
    # That prefix ALSO caught
    # `parity3a_cadence_feasible_verdict_matches_the_committed_cadence`, which
    # is not `#[ignore]`d and needs nothing but the committed `cadence.json` -
    # so the complete profile silently stopped running a real test and the
    # coverage audit failed it as orphaned, exactly the outcome the note above
    # predicts. Found 2026-08-08 by the codex program review.
    "parity3a_fingerprint_matches_the_committed_artifact",
    "parity3a_cadence_matches_the_committed_artifact",
    "parity3b_",
    # The select_windows gate re-reads the four CME one-minute archives under
    # `research/market-data`, roughly 1.5 GB that no clone carries. Named in
    # full rather than by a `parity_select_windows_` prefix, following the 3a
    # lesson above: `the_blessed_constants_match_the_port` sits in the same file,
    # needs nothing but the committed artifact, and must keep running here.
    # Run the gate by name: `brokkr test -p mogwai-lab
    # parity_select_windows_reproduces --timeout 279`.
    "parity_select_windows_reproduces_the_blessed_reference",
    # The cache-level gate additionally needs the Python's own feature cache,
    # which is gitignored. It is the layer the blessed artifact structurally
    # cannot see, so it is a separate gate rather than an extension of the one
    # above.
    "parity_select_windows_cache_deviations_are_exactly_the_recorded_ones",
]
certifies = "complete"

# Doctests are off (the `[test] doctests` default) to match CI, which runs
# under cargo-nextest and never executes them; running them here would gate on
# a signal CI cannot see. The complete profile's coverage audit refuses to
# certify without that choice declared - it is invisible to the enumeration, so
# an undeclared `doctests = false` would be an unaudited hole rather than a
# decision. This workspace has no doctests today, so the entry justifies zero
# pairs; it is the declaration that is load-bearing, not the count.
# `brokkr` is local development tooling; `mogwai` is the shipped venue binary.
# Naming one from the other inverts the layering: a clone without `brokkr` on
# PATH cannot run the command at all, and under this repository's own
# convention - every command runs through `brokkr run` - a spawned child blocks
# forever on the workspace lock its own parent already holds.
#
# That is not hypothetical. Protocol 12b brick N shipped a gate that ran
# `brokkr check --gate` as a subprocess to prove the suite was green; invoked
# the documented way it deadlocked instantly and sat for 23 minutes before
# anyone looked at `brokkr lock`. The code even carried a comment describing
# the deadlock, written to defend the TESTS against it while leaving the
# production path live.
#
# So the rule is the string, not the call: a source file has no business
# mentioning the build tool at all. Prose about it belongs in markdown, where
# it cannot become an invocation.
[[textlint]]
name = "no-brokkr-in-rust-source"
pattern = 'brokkr'
paths = ["crates/**/*.rs"]
message = "brokkr is local dev tooling and must never be named from shipped Rust; put the prose in markdown and run the gate outside the binary"

# ---------------------------------------------------------------------------
# THE BENCHMARK REGISTRY: targets and their feature shapes, plus out-of-git
# inputs. Nothing else.
#
# WHAT IS NOT HERE, deliberately: workloads. Every mogwai surface takes a
# config-shaped invocation - preset, window, seed, cell, probe mode - so the
# set of things worth measuring is the PRODUCT of surfaces, inputs and flag
# axes, plus every library-level loop that has no command at all. That product
# cannot be enumerated, and a registry that must be edited before a new
# question can be asked does not survive a decade of asking them. An earlier
# cut of this file froze four invocations by name and had already run out of
# room before the Stage A round started. The argv is composed at the CALL SITE
# and captured verbatim in the row; pairing rows is a query (`--command`,
# `--dataset`, `--grep`, `--grep-v`), not a name lookup, and the captured argv
# cannot lie about what was run the way a name can.
#
# TWO KINDS OF SURFACE.
#
# ARGV-SHAPED, through the shipped bin - `gen`, `tick-composition`,
# `preflight`, `measure`, `fit`, `cache`, `synth`, `arrival-screen`. These need
# no registration beyond the bin itself: benching through
# `target/release/mogwai` measures what ships, startup and argument parsing
# included, which is the honest end-to-end number.
#
# HARNESS-SHAPED, through an example target - the loops with no command line:
# the arrival draw, the screen's projection, and in time the engine's matching
# loop, the `TickSource` implementations, the serving path and the adapter.
# These are the MAJORITY of the eventual surface, which is why they get first
# class registration rather than an escape hatch. Adding a surface to the
# measurable set is registering a target, which is the work you were going to
# do anyway the moment you wanted to optimize it.
#
# Harnesses may take an argv, like the bin. An argument-free harness would need
# a new entry here per cell shape or seed, which is the enumeration trap again
# at one remove.
[mogwai]
package = "mogwai-cli"
# The bin target name differs from the package name, and that is load-bearing
# rather than incidental: the shipped launcher and every doc exec
# `target/release/mogwai`.
bin = "mogwai"

# The parent draw with no projection attached.
#
# It is registered with its feature shape because that is what was missing when
# `--hotpath` recorded rows containing no profile: `hotpath` is an optional
# dependency and both harnesses carry `required-features`, so without the
# feature named here the annotations compile away and the target does not build
# at all. `hotpath-alloc` is the strict superset and is what `--alloc` needs;
# brokkr selects it for that mode.
[mogwai.targets.arrival_walk]
package = "mogwai-data"
example = "arrival_walk_bench"
features = ["hotpath"]

# One Stage A screen cell.
#
# Deliberately a SEPARATE ms-scale target rather than a mode of the full screen,
# and this is a property of the profiler rather than an architectural layer. The
# hotpath crate queues one event per instrumented call and drains at roughly
# 1.3M events/s; the arrival draw produces them far faster than that, so a
# seconds-scale run backlogs tens of gigabytes before it ends. dellingr ships a
# second ms-scale file per workload for exactly this reason and pbfhogg keeps
# its instrumentation sparse to avoid it.
[mogwai.targets.screen_projection]
package = "mogwai-lab"
example = "screen_projection_bench"
features = ["hotpath"]

[mogwai.targets.ring_sizing]
package = "mogwai-lab"
example = "ring_sizing"
features = ["hotpath"]

[mogwai.targets.stage_a_batch]
package = "mogwai-lab"
example = "stage_a_batch_bench"

# One predictive-envelope replicate month, per spec 9.7.
#
# The unit the envelope budgets are derived from: an evaluation is 500 * (1 + K)
# months and nothing else, so a per-month price multiplies out to every K tier.
# Carries NO registered features - its canonical output is a wall and a unit
# price, and an instrumented build would measure the profiler instead. Argv is
# `<family> [months]`.
[mogwai.targets.envelope_evaluation]
package = "mogwai-lab"
example = "envelope_evaluation_bench"

# The per-frame cost of the wire decoder, over one representative `Trade`.
#
# Registered so the tag-decode table in `reference/performance.md` is
# re-runnable rather than a number someone once printed. Carries NO features
# and the profiler MODES do not apply: it wraps the global allocator itself to
# count allocator calls per frame, which `--alloc` would displace, and its
# per-frame cost is nanoseconds, which `--hotpath` would dominate. Argv is an
# optional iteration count, default 2,000,000.
[mogwai.targets.tag_decode_probe]
package = "mogwai-protocol"
example = "tag_decode_probe"

# NOT REGISTERED: `fill_walk_bench`, also an example target in `mogwai-data`.
# It is a criterion harness that parses `--bench` itself - that is what lets it
# live in an example target at all - so it would collide with the mode flag.
# Run it with `brokkr run --release fill_walk_bench -- --bench`.

# The delivered corpus, per host. This records WHICH delivery a row was measured
# against so a cross-month comparison can tell two corpora apart. It does NOT
# replace the run's own verification: `measure` refuses a corpus whose SHA-256
# hashes disagree with the ledger and the committed preflight artifact, and that
# check is about the CONTENTS being the ones the method was fitted to. This
# digest is about DRIFT - the file under this path not being the file it was
# last time - which is a different question and is why the two hashes are
# allowed to be different algorithms over different scopes.
#
# The digest is over the DIRECTORY - two `.csv.zst` archives beside
# `manifest.json`, `metadata.json` and `condition.json` - because that is what
# `measure --corpus` takes.
#
# XXH128, which is not the SHA-256 the delivery manifest carries. There is
# nothing to transcribe from the manifest here; this value came from
# `brokkr env` and is the only place it can come from.
[bygg.datasets.mnq-tbbo-july]
path = "research/market-data/databento/mnqv/2026-07.full.tbbo"
xxh128 = "280ade40376bd49f50c579bb127f3fbd"

[[quarantine]]
category = "doctests"
issue = "n/a"
reason = "CI runs cargo-nextest, which never executes doctests; gating on them here would test a signal CI cannot see"
