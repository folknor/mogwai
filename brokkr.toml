project = "mogwai"

# The default shape: every crate with no feature on. That is the shipped shape
# and the one every consumer builds - `mogwai-data` and `mogwai-lab` each carry
# `hotpath`/`hotpath-alloc`, and both are optional dependencies precisely so
# that with neither feature named the profiler is absent from the dependency
# graph rather than merely inert.
[[check]]
name = "workspace"

# The instrumented shape. It exists because a feature nothing compiles is a
# feature that is broken and nobody knows: with `hotpath` off, every
# `cfg_attr(feature = "hotpath", hotpath::measure)` annotation and both
# `required-features` harness examples vanish from the build, so a rename, a
# moved function or a macro-argument change breaks nothing that any lane runs.
#
# `hotpath-alloc` rather than `hotpath` because it is the strict superset - it
# enables `hotpath` too, and additionally compiles the harnesses'
# `#[global_allocator]` declarations, which the timing-only feature does not.
# One sweep therefore covers both feature shapes' code.
#
# Scoped with `packages` because this is a virtual workspace: cargo rejects
# `--features` at the root, so the features have to be attributed to the crates
# that declare them.
[[check]]
name = "instrumented"
packages = ["mogwai-data", "mogwai-lab"]
features = ["hotpath-alloc"]

# The wall-clock contract, and the only sweep in this workspace that compiles
# release. It asserts a latency budget, so the build profile is not an
# implementation detail of how it is run - it is part of what it measures.
# Running a latency assertion in a dev lane does not produce a weaker result: it
# produces a meaningless one.
#
# It is excluded from the gate (its lane is dev, and it is `#[ignore]`d at the
# source, so it is in the gate's `skip` list) and lives here instead, where
# `brokkr test` resolves it at the profile it needs whatever the project-wide
# default becomes. That ordering is the point of the key: a sweep's profile beats
# `[test] debug`, so the documented bare invocation cannot silently pick dev.
#
# `curated` because the entry runs one named test rather than a package's suite.
# Without it a `certifies = "complete"` profile would have to reference this
# sweep, and the release build shape would then enumerate a coverage universe of
# its own - every test in the workspace, none of them run here.
#
# It used to name two. `tape_lateness_under_acceleration` was the other, and it
# is gone from the suite entirely rather than moved between lanes: its 50 ms p99
# is a statement about the host, not about this code - a release run failed it at
# 311 ms under a load average of 1.46 - and no admission test distinguishes a
# machine that can judge that budget from one that cannot. A gate that must be
# excluded from every lane that would run it measures nothing, so it became a
# measurable target, `tape_lateness` below, where every run records the number
# against the machine and the commit that produced it.
#
# A note on `only`: it is a substring filter, so `read_market_latency` catches
# `read_market_latency_stays_within_submit_budget` and nothing else today. The
# name is also in the gate's `skip` list, because the two lists state one
# decision - a wall-clock contract excluded from the debug gate exactly because the
# release sweep evaluates it - and they have to agree.
#
# What enforces the agreement, and what does not. A Rust test used to hold the
# two lists against each other by reconstructing every test name from source;
# it was deleted on 2026-08-20 when the tool grew the checks it was standing in
# for. What the tool now guarantees is the half that bites: a test this `only`
# filter runs which the gate does not skip is an orphaned pair, because the gate
# would then be evaluating a wall-clock contract in a debug lane, and a filter
# matching no test at all is a dead filter. Both are resolved against libtest's
# own enumeration.
#
# The remaining direction - that the two lists were written from one decision -
# is a claim about intent and nothing checks it. Comparing them as substrings
# never could: `skip.contains(filter)` is satisfied by any unrelated long entry,
# and the sound converse refuses the pair below, where the `only` filter is
# deliberately the shorter of the two.
[[check]]
name = "timing"
profile = "release"
only = ["read_market_latency"]
curated = true

[test]
gate_profile = "gate"

# `brokkr test` builds dev. The focused runner is used for bite-checks and
# single-test debugging, where release LTO compile time dominates wall time and
# the optimization level changes nothing about the property under test - which is
# why nearly every invocation of it in this repo was already passing `--debug` by
# hand. Making that the default removes a flag everyone was typing.
#
# It is safe only because the two tests that genuinely need release now say so
# themselves, in the `timing` sweep above. A sweep's profile beats this key, so
# the bare documented invocation cannot silently pick dev for them. Anything else
# that turns out to depend on optimization belongs in that sweep too, never in a
# reader remembering to pass `--release`.
debug = true

# The wall-clock lane, run deliberately: `brokkr check --profile timing`. It is
# not part of the gate and is not meant to be - `reference/performance.md` keeps
# the authoritative numbers, and `brokkr.toml`'s own note on
# `tape_lateness_under_acceleration` records that even a release run failed at
# 311 ms under a load average of 1.46. No admission test yet distinguishes a host
# that can judge these budgets from one that cannot, so a red result here is a
# question rather than a verdict.
[test.profiles.timing]
description = "The wall-clock latency contracts, in release, run on purpose"
sweeps = ["timing"]
include_ignored = true

# `brokkr check --gate` - the complete answer, and the only invocation that
# runs the adapter's socket-backed integration tests.
#
# Those four binaries (`adapter_smoke`, `data_client_transport`, `havoc`,
# `reconciliation`) are `#[ignore]`d because they bind real loopback listeners,
# which not every environment allows - a sandbox without sockets fails them for
# reasons that have nothing to do with the code. So plain `brokkr check` stays
# as it was: fast, sandbox-safe, and blind to them.
#
# That blindness has cost real bugs. The `account_id` field the multi-account
# landing added to `AccountState`, and the websocket URL that landing broke by
# appending the path after the query string, both shipped red and stayed red
# across three commits, because the only tests that exercised them never ran.
# Each was found by hand. `include_ignored` here is what makes them a gate
# rather than a thing someone remembers to run.
#
# `certifies = "complete"` also turns on the coverage audit: any (build shape,
# test) pair no lane runs must be justified below or `#[ignore]`d at the
# source, so a test quietly dropping out of the run is an error rather than a
# silence.
# `include_ignored` pulls in two unrelated families, and only one of them is
# what this gate is for. The socket-backed tests are `#[ignore]`d for an
# environment reason - they bind loopback listeners - and are fast, so the gate
# runs them. The other family is the `#[ignore]`d instruments, and the honest
# statement of why they are skipped is not one sentence - it used to be
# "every one of them outlives the 20-second per-test hang watchdog by design",
# and the 2026-08-18 tape round measured that claim and found it false for most
# of them. It is kept per entry now, beside the entry, with a number:
#
#   - `vol_probe` and the `parity12a_`, `parity3b_`, envelope, exposure-pin and
#     screen-oracle entries really are minutes-long walks. The watchdog claim is
#     theirs, and under `include_ignored` they do not report slow, they get
#     killed and fail the gate - which is how `brokkr check --gate` came to be
#     unrunnable in this workspace.
#   - `synthetic_spread_decomposition_at_protocol_seven` (6.46 s), one test per
#     process in dev, is nowhere near the watchdog. It is skipped on inertia,
#     not on cost; see the note beside it. Two entries that sat beside it -
#     the GARCH rail-sizing and regime-envelope instruments, 0.43 s and 0.20 s -
#     are gone from the list and run.
#   - `read_market_latency_stays_within_submit_budget` is not a cost exclusion
#     at all - it is a release-profile wall-clock contract this debug lane
#     cannot validly evaluate. Its own note says so.
#   - `arrival_control_refuses_a_tree_that_changed_during_the_run` is an
#     environment exclusion: it needs, and deliberately dirties, the tree.
#
# A skip entry states a cost and nothing checks it. That is the standing hole
# this heading used to paper over; the per-entry numbers above are the only
# defence, and they decay.
#
# Skipping them costs no coverage: the audit accepts a non-run pair that is
# `#[ignore]`d at the source, and each stays runnable by name, which is the
# documented way to use an instrument anyway - e.g.
# `brokkr test -p mogwai-venue vol_probe`.
#
# The invariant every pattern below must satisfy: it may only ever match tests that
# are `#[ignore]`d at the source. That is what makes skipping them free - the
# audit accepts a non-run pair that is ignored, because `include_ignored` is
# the only reason it was in scope at all. A pattern matching a non-ignored test
# silently stops running a real one, and the audit then fails it as orphaned
# rather than letting it disappear. That is not hypothetical: the `parity3a_`
# prefix did exactly this, and the audit caught it. Prefer full test names;
# a prefix is only safe while every test that shares it stays ignored, which
# is a property of files this file cannot see.
#
# It is enforced by the tool itself, in two places, and no longer by a Rust
# test that reconstructed every name in the workspace from source text. A
# pattern swallowing a live test leaves an orphaned pair; a pattern matching
# nothing at all is a dead filter, named with the block that declared it and
# judged over the union of the sweeps that block applies to. Both read libtest's
# own enumeration, so neither can go blind to a declaration form the way the
# hand-written scanner did - it could not see macro-generated tests for a while,
# and a scanner that sees nothing agrees with every list there is.
[test.profiles.gate]
description = "Everything, including the socket-backed adapter tests"
sweeps = ["workspace", "instrumented"]
include_ignored = true
# Serial, this gate took 3m01s: 164s of test execution, so the wall was the sum
# of 1,608 tests rather than the longest of them. That is not a compute bill -
# the top 20 tests are 54% of it and most of them are waiting, on a declared
# `--duration` or a reconnect ladder. At 8 the gate runs in about a minute with
# per-test times unmoved (the slowest tape walk went 7.622s to 7.768s), which is
# what says the tests are not starving each other.
#
# 16 is past the cliff. The one test that could not take parallelism at all is
# now `#[ignore]`d and skipped below; the rest of that story, and the work that
# would let this go higher, is the parallel item in `notes/todo.md`.
test_threads = 8
skip = [
    # The declared-deadline family is gone from this list, and the note stays
    # because the shape recurs. Two entries sat here - the completion gates
    # `venue_announces_run_complete_and_exits_zero_at_the_declared_sim_deadline`
    # and `run_complete_reaches_every_open_socket` - each giving the venue a
    # fixed `--duration` measured from readiness and then betting that the
    # consumer's connect beat it. Under parallel execution the connect could lose,
    # the run completed and closed before the socket existed, and the test failed
    # on not having seen the frame: a wrong answer rather than a timeout, which is
    # why it read like a real regression.
    #
    # They were not retuned to a longer duration, because a margin is exactly
    # what a crowded host takes away. `completion.rs` establishes the premise
    # instead - `watch_a_bounded_run` drains every socket and discards the whole
    # run unless each of them saw a frame, relaunching until it has one this test
    # was demonstrably a live passenger on - so a lost race is no longer a
    # statement about the venue. The same treatment went to the two siblings that
    # had the identical shape and had simply not lost yet.
    #
    # A second cause surfaced once the failures were truthful, and it is the one
    # that actually kept this lane red: those venues were `speed = 0.0`, so
    # delivery is unpaced and `RunComplete` is queued behind the entire backlog
    # the run generated flat out - over 1.4 million frames against a consumer
    # draining about 111,000 a second. The family runs on
    # `tests/configs/bounded-run.toml` now, which is `fast.toml` at `speed = 1.0`.
    #
    # A measurement instrument, not a race: `vol_probe` walks millions of ticks.
    "vol_probe",
    # A release-profile wall-clock contract, excluded from this debug lane
    # because that lane cannot validly evaluate it - not because the property
    # is being dropped. The debug binary measures latency for reasons that are
    # about the build profile rather than the code, so a red result here is not
    # evidence about the stated property, and running it anyway is itself a
    # changed measuring instrument. The test stays `#[ignore]`d and directly
    # runnable, and `reference/performance.md` keeps the release result.
    #
    # `tape_lateness_under_acceleration` used to sit beside it here with the
    # same justification, and that justification had run out: excluded from the
    # debug lane for being a latency budget and excluded from the release lane
    # in practice for being unjudgeable on a loaded host, it was a gate no lane
    # evaluated. It is now the `tape_lateness` measurable target instead.
    "read_market_latency_stays_within_submit_budget",
    # `dwell_is_bounded_across_run_seeds` used to sit here and no longer does.
    # It was excluded under the cost heading above - "walks millions of ticks",
    # "outlives the 20-second per-test hang watchdog by design" - and that claim
    # was measured false: its eight arms are `DRAW / 8` apiece, the same two
    # million parent events in total as `realism`, and it runs in 6.54 s. The
    # consequence of the wrong claim was that the repository's only multi-seed
    # dwell gate was the one test nothing ever ran, while a single-seed twin at
    # the full draw ran on every lane for the same wall clock. The twin is gone,
    # seed 42 moved into the loop, and the gate runs the eight-arm version.
    #
    # Two more entries left on 2026-08-19, for the same reason and with the
    # same result. `standardized_candidate_rail_sizing` - now
    # `shipped_garch_rails_sit_above_the_clean_tail` - measured 0.43 s and
    # `realized_return_envelope_under_regime_scaling` 0.20 s, one test per
    # process in dev, against a heading claiming both outlive the watchdog.
    # The cost of the wrong claim was the same as the dwell pair's: the
    # repository's only measurement behind `GARCH_SIGMA_CAP`,
    # `FEEDBACK_RETURN_CEILING` and `REALIZED_RETURN_CEILING` - the 57.2x sigma
    # excursion and the 3.33e-3 clean return that `consts.rs` cites in prose -
    # was a test nothing ran. Both are un-ignored and read the shipped
    # constants now.
    #
    # `synthetic_spread_decomposition_at_protocol_seven` at 6.46 s is the only
    # entry left that the cost heading describes even loosely, and it is not
    # resolved here.
    "synthetic_spread_decomposition_at_protocol_seven",
    # The protocol-12a parity gates (the retired rewrite plan, phase 2a):
    # one reads the multi-GB delivered July corpus, the eight seed gates each
    # run a month-long walk. Minutes apiece, far past the per-test ceiling, and
    # both need artifacts that only exist on a machine holding the delivery.
    # Run them by name: `brokkr test -p mogwai-cli parity12a_observed
    # --timeout 279` and `... parity12a_generated_seed_N --timeout 279`.
    "parity12a_",
    # The 12b brick E envelope gates, both `#[ignore]`d at the source for a
    # cost reason: the closed-form conformance cross-check walks 12 cells by
    # 2,000 simulated exposures, measured at about 168 s, and the fidelity gate
    # runs 32 real candidate walks against 32 idealized months per probe cell
    # at two grid steps, 54 s to 142 s per part. Both outlive the 20-second
    # watchdog by design; the whole suite is about 16 minutes serial, and every
    # part is inside the runner's 280 s ceiling. Per-part walls are tabulated
    # in `reference/performance.md`.
    #
    # The fidelity gate has no one-command form, and this comment used to give
    # one that cannot run. `--timeout` is honored only when the filter matches
    # exactly one test, and `brokkr test` errors out before running when it
    # matches more; the prefix below matches all ten macro-generated parts, so
    # `brokkr test -p mogwai-lab the_envelope_simulator_is_faithful_to_the_candidate_walks --timeout 279`
    # fails with a config error rather than running anything. Run the parts one
    # at a time, appending each family and step suffix to the prefix -
    # `_event_markov_1s`, `_event_markov_250ms`, `_wall_mmpp_1s`,
    # `_wall_mmpp_250ms`, `_log_ou_cox_1s`, `_log_ou_cox_250ms`,
    # `_self_exciting_1s`, `_self_exciting_250ms`, `_shot_noise_1s`,
    # `_shot_noise_250ms` - for example:
    # `brokkr test -p mogwai-lab the_envelope_simulator_is_faithful_to_the_candidate_walks_shot_noise_1s --timeout 279`.
    # The conformance gate is a single test, so its own command does run:
    # `brokkr test -p mogwai-lab the_envelope_matches_the_closed_forms_where_they_are_exact --timeout 279`.
    "the_envelope_matches_the_closed_forms_where_they_are_exact",
    "the_envelope_simulator_is_faithful_to_the_candidate_walks",
    # Protocol 12b brick N3's two pins, both `#[ignore]`d at the source and
    # both unrunnable in this lane for reasons the lane cannot fix.
    #
    # The exposure pin holds the two copies of the 12b section 8 exposure
    # contract equal - `mogwai_lab::arrival_control::control_generated_pass`
    # and `mogwai_cli::measure::run_final_walk`, which must be two because the
    # lab cannot depend on the CLI. It runs a month-long walk on each side,
    # like its `parity12a_` neighbours above, so it is minutes past the
    # watchdog. Run it by name: `brokkr test -p mogwai-cli
    # the_lab_walk_matches_the_measure_exposure_contract --timeout 279`.
    #
    # The re-attestation pin is fast - roughly a second at its shortened
    # window - but it is excluded for an environment reason rather than a cost
    # one: it asserts that a tree which moves mid-run leaves the artifact
    # unwritten, so it needs a clean tree to get past the run's own first step,
    # and it deliberately dirties the tree while it is in flight. Neither is
    # acceptable inside a general check lane. Run it by name from a committed
    # tree: `brokkr test -p mogwai-cli
    # arrival_control_refuses_a_tree_that_changed_during_the_run`.
    "the_lab_walk_matches_the_measure_exposure_contract",
    "arrival_control_refuses_a_tree_that_changed_during_the_run",
    # Protocol 12b brick A's blocking projection oracle runs eight committed
    # month-scale walks. It is invoked deliberately with the extended timeout
    # named by its implementation spec.
    "arrival_screen_layer1_reproduces_the_committed_12a_generated_blocks",
    # Phase 3a/3b parity gates: the cadence gate streams three multi-GB
    # Binance archives, the 3b fit gate reads the delivered July corpus and
    # the Python-era walk cache, and the session-profile gate needs the NQ
    # one-minute archive. All need local data no clone carries. Run them by
    # name: `brokkr test -p mogwai-cli parity3b --timeout 279` and
    # `brokkr test -p mogwai-lab parity3b_session_profile`.
    #
    # The 3a pair is named in full rather than skipped by `parity3a_` prefix.
    # That prefix ALSO caught
    # `parity3a_cadence_feasible_verdict_matches_the_committed_cadence`, which
    # is not `#[ignore]`d and needs nothing but the committed `cadence.json` -
    # so the complete profile silently stopped running a real test and the
    # coverage audit failed it as orphaned, exactly the outcome the note above
    # predicts. Found 2026-08-08 by the codex program review.
    "parity3a_fingerprint_matches_the_committed_artifact",
    "parity3a_cadence_matches_the_committed_artifact",
    "parity3b_",
    # The select_windows gate re-reads the four CME one-minute archives under
    # `research/market-data`, roughly 1.5 GB that no clone carries. Named in
    # full rather than by a `parity_select_windows_` prefix, following the 3a
    # lesson above: `the_blessed_constants_match_the_port` sits in the same file,
    # needs nothing but the committed artifact, and must keep running here.
    # Run the gate by name: `brokkr test -p mogwai-lab
    # parity_select_windows_reproduces --timeout 279`.
    "parity_select_windows_reproduces_the_blessed_reference",
    # The cache-level gate additionally needs the Python's own feature cache,
    # which is gitignored. It is the layer the blessed artifact structurally
    # cannot see, so it is a separate gate rather than an extension of the one
    # above.
    "parity_select_windows_cache_deviations_are_exactly_the_recorded_ones",
]
certifies = "complete"

# Doctests are off (the `[test] doctests` default) to match CI, which runs
# under cargo-nextest and never executes them; running them here would gate on
# a signal CI cannot see. The complete profile's coverage audit refuses to
# certify without that choice declared - it is invisible to the enumeration, so
# an undeclared `doctests = false` would be an unaudited hole rather than a
# decision. This workspace has no doctests today, so the entry justifies zero
# pairs; it is the declaration that is load-bearing, not the count.
# `brokkr` is local development tooling; `mogwai` is the shipped venue binary.
# Naming one from the other inverts the layering: a clone without `brokkr` on
# PATH cannot run the command at all, and under this repository's own
# convention - every command runs through `brokkr run` - a spawned child blocks
# forever on the workspace lock its own parent already holds.
#
# That is not hypothetical. Protocol 12b brick N shipped a gate that ran
# `brokkr check --gate` as a subprocess to prove the suite was green; invoked
# the documented way it deadlocked instantly and sat for 23 minutes before
# anyone looked at `brokkr lock`. The code even carried a comment describing
# the deadlock, written to defend the tests against it while leaving the
# production path live.
#
# So the rule is the string, not the call: a source file has no business
# mentioning the build tool at all. Prose about it belongs in markdown, where
# it cannot become an invocation.
#
# No exclusions remain, as of 2026-08-20, and getting rid of the last one is why the
# tool grew its dead-filter check. `gate_skip_list.rs` was excluded because it
# enforced two invariants about the lists above - that a skip pattern may match
# only `#[ignore]`d tests, and that no filter is dead - which it could only do
# by reading this very file. The exemption was sound on its own terms (it read the
# config as data and spawned nothing, and a self-check kept it that way), but it
# rested on a hand-written parser that reconstructed libtest names from source
# text and had already gone blind once, to macro-generated tests.
#
# Both invariants are the tool's now, resolved against libtest's own
# enumeration: a skip catching a live test is an orphaned pair, and a filter
# matching nothing is a dead filter naming the block that declared it. The file
# kept only its two source-hygiene scans, which never mentioned the tool, and is
# `test_hygiene.rs`. An exemption removed beats an exemption re-checked.
# The no-shouting family: the AGENTS.md rule that emphasis is carried by the
# words and where they sit, never by all-caps. 5+ letters is the threshold: it
# clears the great majority of acronyms (VM, RHS, CI, API, TOML, JSON, HTTP)
# without an allowlist, while catching the words people actually shout. Known
# coarseness, deliberate in both directions: `except` exempts the whole
# physical line, so a line carrying both a backticked env var and genuine
# shouting slips through (a false negative costs a missed nit, a false
# positive costs a broken check in a tree that did nothing wrong), and a shout
# built entirely of words under five letters never fires at all.
[textlint_preset.no-shouting]
# Escape hatch: put `shout-ok` in a comment on the offending line, or on one
# of the two lines above it (a wrapped sentence pushes the caps off the line
# the marker would naturally sit on).
allow_marker = "shout-ok"
allow_marker_above = 2
except = [
    # -- Machine text, matched by shape rather than by name. ---------------
    #
    # This is the load-bearing group. Env vars, sentinels and constants are
    # legitimately capitalised and no allowlist could ever be finished, so
    # exempt them by the context they appear in:
    #
    #   `RUSTFLAGS`   an inline code span - the single best signal, and the
    #                 one to reach for when something is wrongly flagged
    '`[^`]*[A-Z]{5,}',
    #   $RUSTFLAGS / ${RUSTFLAGS} / %PATH%
    '[$%]\{?[A-Z][A-Z0-9_]*',
    #   RUSTFLAGS=... or RUSTFLAGS: ... (an assignment or a table cell)
    '\b[A-Z][A-Z0-9_]{3,}\s*[:=]',
    #   env!("RUSTFLAGS"), std::env::var("EDITOR"), getenv, os.environ
    '\b(?:env!|env::var(?:_os)?|getenv|environ)',
    #   URLs, and a bare HTTP request line.
    'https?://',
    '^\s*(?://[/!]?|\*|#+)?\s*(?:GET|PUT|POST|PATCH|DELETE|HEAD|OPTIONS)\s+/',
    #
    # SCREAMING_SNAKE_CASE needs no entry at all: `\b` does not break at `_`,
    # so no run of 5+ caps in `REQUEST_TIMEOUT_SECS` is ever whole-word and
    # the pattern never fires on it. Only single-word names are exposed, and
    # the three rules above cover how those are actually written.

    # -- Idiomatic section markers, not emphasis. --------------------------
    '^\s*(?://[/!]?|\*|#+)?\s*(?:SAFETY|PANICS|ERRORS|INVARIANT|WARNING|DEPRECATED)\b',

    # -- Acronyms and proper nouns that are legitimately 5+ letters. -------
    # Short by design: prose acronyms are mostly 2-4 letters and clear the
    # threshold for free. Bare env-var mentions that escape the shape rules
    # above (a sentence naming RUSTFLAGS with no backticks) belong here too.
    # The second alternation is this project's vocabulary: the venue name,
    # instrument symbols, the GARCH model, and the root license filenames.
    '\b(?:ASCII|HTTPS|README|LICENSE|SQLITE|POSIX|JSONL|MSRV|NOTICE|RUSTFLAGS|EDITOR|PAGER|VISUAL|LOGNAME|HOSTNAME|RUSTUP)\b',
    '\b(?:MOGWAI|GARCH|BTCUSDT|BTCUSD|ETHUSDT|ETHUSD|SOLUSDT|XBTUSD|YYYYMM|COMMERCIAL-LICENSE)\b',
    # Signal, errno and flag names, and OHLCV - comment prose in a systems
    # codebase names these constantly and they are spellings, not emphasis.
    '\b(?:SIGKILL|SIGTERM|SIGPIPE|SIGINT|ESRCH|EPIPE|ECONNRESET|EAGAIN|ELOOP|ETXTBSY|O_NONBLOCK|OHLCV|VWAP|TWAP)\b',
    # The root convention files, named bare in prose without backticks, and
    # FOOBAR, the placeholder symbol docs/presets.md's fenced example uses.
    '\b(?:AGENTS|CLAUDE)\.md',
    '\bFOOBAR\b',
]

[[textlint]]
name = "no-shouting-rust"
preset = "no-shouting"
pattern = '\b[A-Z]{5,}\b'
paths = ["crates/**/*.rs"]
# `region = "comment"` keeps this off string literals and, crucially, off
# code: a real `const CONFIRMED` or a matched `SomeEnum::CONFIRMED` is not
# shouting. Its tokenizer is Rust-only, which is why this rule does not also
# claim the Python under scripts/ and analysis/ - those comments are simply
# unlinted for now.
region = "comment"
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-shouting-markdown"
preset = "no-shouting"
pattern = '\b[A-Z]{5,}\b'
paths = ["**/*.md"]
# research/ is vendored upstream and stays unlinted; notes/ is linted like
# everything else since the 2026-08-23 de-shout of the transient prose.
exclude = ["research/**"]
# textlint has no markdown fence awareness, so exempt indented code blocks by
# shape; a fenced block that trips the rule takes a shout-ok marker instead.
except = ['^ {4,}\S', '^\t']
message = "write the emphasis into the sentence; don't shout in all caps (shout-ok to allow)"

[[textlint]]
name = "no-brokkr-in-rust-source"
pattern = 'brokkr'
paths = ["crates/**/*.rs"]
message = "brokkr is local dev tooling and must never be named from shipped Rust; put the prose in markdown and run the gate outside the binary"

# ---------------------------------------------------------------------------
# The benchmark registry: targets and their feature shapes, plus out-of-git
# inputs. Nothing else.
#
# What is not here, deliberately: workloads. Every mogwai surface takes a
# config-shaped invocation - preset, window, seed, cell, probe mode - so the
# set of things worth measuring is the product of surfaces, inputs and flag
# axes, plus every library-level loop that has no command at all. That product
# cannot be enumerated, and a registry that must be edited before a new
# question can be asked does not survive a decade of asking them. An earlier
# cut of this file froze four invocations by name and had already run out of
# room before the Stage A round started. The argv is composed at the call site
# and captured verbatim in the row; pairing rows is a query (`--command`,
# `--dataset`, `--grep`, `--grep-v`), not a name lookup, and the captured argv
# cannot lie about what was run the way a name can.
#
# Two kinds of surface.
#
# Argv-shaped, through the shipped bin - `gen`, `tick-composition`,
# `preflight`, `measure`, `fit`, `cache`, `synth`, `arrival-screen`. These need
# no registration beyond the bin itself: benching through
# `target/release/mogwai` measures what ships, startup and argument parsing
# included, which is the honest end-to-end number.
#
# Harness-shaped, through an example target - the loops with no command line:
# the arrival draw, the screen's projection, and in time the engine's matching
# loop, the `TickSource` implementations, the serving path and the adapter.
# These are the majority of the eventual surface, which is why they get first
# class registration rather than an escape hatch. Adding a surface to the
# measurable set is registering a target, which is the work you were going to
# do anyway the moment you wanted to optimize it.
#
# Harnesses may take an argv, like the bin. An argument-free harness would need
# a new entry here per cell shape or seed, which is the enumeration trap again
# at one remove.
[mogwai]
package = "mogwai-cli"
# The bin target name differs from the package name, and that is load-bearing
# rather than incidental: the shipped launcher and every doc exec
# `target/release/mogwai`.
bin = "mogwai"

# The parent draw with no projection attached.
#
# It is registered with its feature shape because that is what was missing when
# `--hotpath` recorded rows containing no profile: `hotpath` is an optional
# dependency and both harnesses carry `required-features`, so without the
# feature named here the annotations compile away and the target does not build
# at all. `hotpath-alloc` is the strict superset and is what `--alloc` needs;
# brokkr selects it for that mode.
[mogwai.targets.arrival_walk]
package = "mogwai-data"
example = "arrival_walk_bench"
features = ["hotpath"]

# One Stage A screen cell.
#
# Deliberately a separate ms-scale target rather than a mode of the full screen,
# and this is a property of the profiler rather than an architectural layer. The
# hotpath crate queues one event per instrumented call and drains at roughly
# 1.3M events/s; the arrival draw produces them far faster than that, so a
# seconds-scale run backlogs tens of gigabytes before it ends. dellingr ships a
# second ms-scale file per workload for exactly this reason and pbfhogg keeps
# its instrumentation sparse to avoid it.
[mogwai.targets.screen_projection]
package = "mogwai-lab"
example = "screen_projection_bench"
features = ["hotpath"]

# How late a paced tape arrives at a consumer that keeps up, under acceleration.
#
# A gate that became a measurement. It was `tape_lateness_under_acceleration`,
# asserting a 50 ms p99 - a statement about the host rather than about the code,
# unjudgeable in the debug lane and unreliable in the release one, and therefore
# excluded from both. The number is worth having on every run; the threshold was
# never portable. Argv is `[config] [sample_seconds]`.
#
# Carries no registered features: its canonical output is a set of scraped
# counters, and an instrumented build would be measuring the profiler's own
# per-call cost inside a latency figure.
[mogwai.targets.tape_lateness]
package = "mogwai-cli"
example = "tape_lateness_bench"

[mogwai.targets.ring_sizing]
package = "mogwai-lab"
example = "ring_sizing"
features = ["hotpath"]

[mogwai.targets.stage_a_batch]
package = "mogwai-lab"
example = "stage_a_batch_bench"

# One predictive-envelope replicate month, per spec 9.7.
#
# The unit the envelope budgets are derived from: an evaluation is 500 * (1 + K)
# months and nothing else, so a per-month price multiplies out to every K tier.
# Carries no registered features - its canonical output is a wall and a unit
# price, and an instrumented build would measure the profiler instead. Argv is
# `<family> [months]`.
[mogwai.targets.envelope_evaluation]
package = "mogwai-lab"
example = "envelope_evaluation_bench"

# The per-frame cost of the wire decoder, over one representative `Trade`.
#
# Registered so the tag-decode table in `reference/performance.md` is
# re-runnable rather than a number someone once printed. Carries no features,
# and the profiler modes do not apply: it wraps the global allocator itself to
# count allocator calls per frame, which `--alloc` would displace, and its
# per-frame cost is nanoseconds, which `--hotpath` would dominate. Argv is an
# optional iteration count, default 2,000,000.
[mogwai.targets.tag_decode_probe]
package = "mogwai-protocol"
example = "tag_decode_probe"

# Not registered: `fill_walk_bench`, also an example target in `mogwai-data`.
# It is a criterion harness that parses `--bench` itself - that is what lets it
# live in an example target at all - so it would collide with the mode flag.
# Run it with `brokkr run --release fill_walk_bench -- --bench`.

# Not registered: `symbol_decode_probe`, an example target in `mogwai-protocol`.
# It answered one question - what an inline fixed-capacity `Symbol` would buy the
# adapter's decode path against what the per-tick path spends right after it -
# and the answer was a refusal, recorded in `reference/performance.md`. A
# registered target invites re-benching a decision already made; a plain example
# keeps the measurement reproducible without inviting that. Run it with
# `brokkr run --release symbol_decode_probe -- 2000000`. It wraps the global
# allocator, so the profiler modes would not apply to it either.

# The delivered corpus, per host. This records exactly which delivery a row was measured
# against so a cross-month comparison can tell two corpora apart. It does not
# replace the run's own verification: `measure` refuses a corpus whose SHA-256
# hashes disagree with the jobs manifest and the committed preflight artifact,
# and that check is about the contents being the ones the method was fitted to.
# This digest is about drift - the file under this path not being the file it
# was last time - which is a different question and is why the two hashes are
# allowed to be different algorithms over different scopes.
#
# The digest is over the whole directory - two `.csv.zst` archives beside
# `manifest.json`, `metadata.json` and `condition.json` - because that is what
# `measure --corpus` takes.
#
# XXH128, which is not the SHA-256 the delivery manifest carries. There is
# nothing to transcribe from the manifest here; this value came from
# `brokkr env` and is the only place it can come from.
[bygg.datasets.mnq-tbbo-july]
path = "research/market-data/databento/mnqv/2026-07.full.tbbo"
xxh128 = "280ade40376bd49f50c579bb127f3fbd"

[[quarantine]]
category = "doctests"
issue = "n/a"
reason = "CI runs cargo-nextest, which never executes doctests; gating on them here would test a signal CI cannot see"
