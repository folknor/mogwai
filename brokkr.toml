project = "mogwai"

# One sweep, the whole workspace. No `features` list because no crate in this
# workspace declares any cargo feature, so this is exactly the legacy
# `--all-features` default it replaces - declared explicitly only so the
# profiles below have an entry to reference.
[[check]]
name = "workspace"

[test]
gate_profile = "gate"

# `brokkr check --gate` - the complete answer, and the only invocation that
# runs the adapter's socket-backed integration tests.
#
# Those four binaries (`adapter_smoke`, `data_client_transport`, `havoc`,
# `reconciliation`) are `#[ignore]`d because they bind real loopback listeners,
# which not every environment allows - a sandbox without sockets fails them for
# reasons that have nothing to do with the code. So plain `brokkr check` stays
# as it was: fast, sandbox-safe, and blind to them.
#
# That blindness has cost real bugs. The `account_id` field the multi-account
# landing added to `AccountState`, and the websocket URL that landing broke by
# appending the path after the query string, both shipped RED and stayed red
# across three commits, because the only tests that exercised them never ran.
# Each was found by hand. `include_ignored` here is what makes them a gate
# rather than a thing someone remembers to run.
#
# `certifies = "complete"` also turns on the coverage audit: any (build shape,
# test) pair no lane runs must be justified below or `#[ignore]`d at the
# source, so a test quietly dropping out of the run is an error rather than a
# silence.
# `include_ignored` pulls in two unrelated families, and only one of them is
# what this gate is for. The socket-backed tests are `#[ignore]`d for an
# ENVIRONMENT reason - they bind loopback listeners - and are fast, so the gate
# runs them. The six below are `#[ignore]`d for a COST reason: they are
# measurement instruments that walk millions of ticks, and every one of them
# outlives the 20-second per-test hang watchdog by design. Under
# `include_ignored` they do not report slow, they get killed and fail the gate,
# which is how `brokkr check --gate` came to be unrunnable in this workspace.
#
# Skipping them costs no coverage: the audit accepts a non-run pair that is
# `#[ignore]`d at the source, and each stays runnable by name, which is the
# documented way to use an instrument anyway -
# `brokkr test -p mogwai-server vol_probe` and its five siblings.
#
# THE INVARIANT every pattern below must satisfy: it may match ONLY tests that
# are `#[ignore]`d at the source. That is what makes skipping them free - the
# audit accepts a non-run pair that is ignored, because `include_ignored` is
# the only reason it was in scope at all. A pattern matching a non-ignored test
# silently stops running a real one, and the audit then fails it as orphaned
# rather than letting it disappear. That is not hypothetical: the `parity3a_`
# prefix did exactly this, and the audit caught it. Prefer full test names;
# a prefix is only safe while every test that shares it stays ignored, which
# is a property of files this file cannot see.
[test.profiles.gate]
description = "Everything, including the socket-backed adapter tests"
sweeps = ["workspace"]
include_ignored = true
skip = [
    "vol_probe",
    # A RELEASE-profile wall-clock contract, excluded from this DEBUG lane
    # because that lane cannot validly evaluate it - not because the property
    # is being dropped. The test asserts a 50 ms p99 pacing bound; the debug
    # binary measures 106-330 ms for reasons that are about the build profile
    # rather than the code, so a red result here is not evidence about the
    # stated property, and running it anyway is itself a changed measuring
    # instrument. The 50 ms assertion is UNCHANGED and authoritative, the test
    # stays `#[ignore]`d and directly runnable
    # (`brokkr test -p mogwai-cli tape_lateness_under_acceleration`), and
    # `reference/performance.md` keeps the release result.
    #
    # Its environment sensitivity is REAL and unresolved: a release rerun on
    # 2026-08-08 failed at 311 ms p99 with a load average of 1.46 across 32
    # visible CPUs, so load average is not a sufficient admission test either.
    # That is open repository work, recorded in `notes/todo.md`. Excluding the
    # test from a lane that cannot judge it does not claim this host meets the
    # budget.
    "tape_lateness_under_acceleration",
    "read_market_latency_stays_within_submit_budget",
    "dwell_is_bounded_across_run_seeds",
    "standardized_candidate_rail_sizing",
    "realized_return_envelope_under_regime_scaling",
    "synthetic_spread_decomposition_at_protocol_seven",
    # The protocol-12a parity gates (the retired rewrite plan, phase 2a):
    # one reads the multi-GB delivered July corpus, the eight seed gates each
    # run a month-long walk. Minutes apiece, far past the per-test ceiling, and
    # both need artifacts that only exist on a machine holding the delivery.
    # Run them by name: `brokkr test -p mogwai-cli parity12a_observed
    # --timeout 279` and `... parity12a_generated_seed_N --timeout 279`.
    "parity12a_",
    # Protocol 12b brick N3's two pins, both `#[ignore]`d at the source and
    # both unrunnable in this lane for reasons the lane cannot fix.
    #
    # The exposure pin holds the two copies of the 12b section 8 exposure
    # contract equal - `mogwai_lab::arrival_control::control_generated_pass`
    # and `mogwai_cli::measure::run_final_walk`, which must be two because the
    # lab cannot depend on the CLI. It runs a month-long walk on each side,
    # like its `parity12a_` neighbours above, so it is minutes past the
    # watchdog. Run it by name: `brokkr test -p mogwai-cli
    # the_lab_walk_matches_the_measure_exposure_contract --timeout 279`.
    #
    # The re-attestation pin is fast - roughly a second at its shortened
    # window - but it is excluded for an ENVIRONMENT reason rather than a cost
    # one: it asserts that a tree which moves mid-run leaves the artifact
    # unwritten, so it needs a CLEAN tree to get past the run's own first step,
    # and it deliberately dirties the tree while it is in flight. Neither is
    # acceptable inside a general check lane. Run it by name from a committed
    # tree: `brokkr test -p mogwai-cli
    # arrival_control_refuses_a_tree_that_changed_during_the_run`.
    "the_lab_walk_matches_the_measure_exposure_contract",
    "arrival_control_refuses_a_tree_that_changed_during_the_run",
    # Protocol 12b brick A's blocking projection oracle runs eight committed
    # month-scale walks. It is invoked deliberately with the extended timeout
    # named by its implementation spec.
    "arrival_screen_layer1_reproduces_the_committed_12a_generated_blocks",
    # Phase 3a/3b parity gates: the cadence gate streams three multi-GB
    # Binance archives, the 3b fit gate reads the delivered July corpus and
    # the Python-era walk cache, and the session-profile gate needs the NQ
    # one-minute archive. All need local data no clone carries. Run them by
    # name: `brokkr test -p mogwai-cli parity3b --timeout 279` and
    # `brokkr test -p mogwai-lab parity3b_session_profile`.
    #
    # The 3a pair is named in full rather than skipped by `parity3a_` prefix.
    # That prefix ALSO caught
    # `parity3a_cadence_feasible_verdict_matches_the_committed_cadence`, which
    # is not `#[ignore]`d and needs nothing but the committed `cadence.json` -
    # so the complete profile silently stopped running a real test and the
    # coverage audit failed it as orphaned, exactly the outcome the note above
    # predicts. Found 2026-08-08 by the codex program review.
    "parity3a_fingerprint_matches_the_committed_artifact",
    "parity3a_cadence_matches_the_committed_artifact",
    "parity3b_",
    # The select_windows gate re-reads the four CME one-minute archives under
    # `research/market-data`, roughly 1.5 GB that no clone carries. Named in
    # full rather than by a `parity_select_windows_` prefix, following the 3a
    # lesson above: `the_blessed_constants_match_the_port` sits in the same file,
    # needs nothing but the committed artifact, and must keep running here.
    # Run the gate by name: `brokkr test -p mogwai-lab
    # parity_select_windows_reproduces --timeout 279`.
    "parity_select_windows_reproduces_the_blessed_reference",
    # The cache-level gate additionally needs the Python's own feature cache,
    # which is gitignored. It is the layer the blessed artifact structurally
    # cannot see, so it is a separate gate rather than an extension of the one
    # above.
    "parity_select_windows_cache_deviations_are_exactly_the_recorded_ones",
]
certifies = "complete"

# Doctests are off (the `[test] doctests` default) to match CI, which runs
# under cargo-nextest and never executes them; running them here would gate on
# a signal CI cannot see. The complete profile's coverage audit refuses to
# certify without that choice declared - it is invisible to the enumeration, so
# an undeclared `doctests = false` would be an unaudited hole rather than a
# decision. This workspace has no doctests today, so the entry justifies zero
# pairs; it is the declaration that is load-bearing, not the count.
# `brokkr` is local development tooling; `mogwai` is the shipped venue binary.
# Naming one from the other inverts the layering: a clone without `brokkr` on
# PATH cannot run the command at all, and under this repository's own
# convention - every command runs through `brokkr run` - a spawned child blocks
# forever on the workspace lock its own parent already holds.
#
# That is not hypothetical. Protocol 12b brick N shipped a gate that ran
# `brokkr check --gate` as a subprocess to prove the suite was green; invoked
# the documented way it deadlocked instantly and sat for 23 minutes before
# anyone looked at `brokkr lock`. The code even carried a comment describing
# the deadlock, written to defend the TESTS against it while leaving the
# production path live.
#
# So the rule is the string, not the call: a source file has no business
# mentioning the build tool at all. Prose about it belongs in markdown, where
# it cannot become an invocation.
[[textlint]]
name = "no-brokkr-in-rust-source"
pattern = 'brokkr'
paths = ["crates/**/*.rs"]
message = "brokkr is local dev tooling and must never be named from shipped Rust; put the prose in markdown and run the gate outside the binary"

[[quarantine]]
category = "doctests"
issue = "n/a"
reason = "CI runs cargo-nextest, which never executes doctests; gating on them here would test a signal CI cannot see"
