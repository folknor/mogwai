[package]
name = "mogwai-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

# The corpus/evidence and measurement layer of the Python-to-Rust rewrite
# (phases 1 and 2 of the retired rewrite plan): the TBBO stream contract,
# session/segment math, manifest-bound input verification and preflight, the
# storage policy (artifact/cache/scratch), and the unified protocol-12a block
# engine.
#
# It depends on mogwai-data and mogwai-protocol for the GENERATED measurement
# side only - the TickEvent/VolTrace/Decimal types a walk emits - and READS
# them exclusively. Nothing here adds, changes or observes a draw, so the
# crate carries no TAPE_PROTOCOL_VERSION obligation of its own (spec 2.3, the
# same consumer-only standing measure12a.rs has). It still depends on neither
# mogwai-venue nor mogwai-engine: the parity tests that need preset and
# profile resolution live in mogwai-cli, which depends on both, precisely so
# the axum stack never lands under the lab.
[dependencies]
mogwai-data.workspace = true
mogwai-protocol.workspace = true
# Phase 3b only: `summary`/`fit` walk against an `InstrumentProfile`, which
# `mogwai-venue` defines and resolves through `Config::load` - the same path
# the retired Python fit implementation's scratch-config walks took.
mogwai-venue.workspace = true

serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
zrip.workspace = true
sha2.workspace = true
rust_decimal.workspace = true
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `sidecar` opens the benchmark marker FIFO non-blocking, and needs exactly one
# thing from here: the `O_NONBLOCK` flag value. Same pin mogwai-venue carries;
# no feature is enabled because `nix::libc` is unconditional.
nix = { version = "0.31.3", default-features = false }
hotpath = { workspace = true, optional = true }

# Examples only. `ring_sizing` allocates one shipped per-boat broadcast ring to
# measure its eager resident cost; the LIBRARY stays runtime-free, which is why
# this is not a dependency.
[dev-dependencies]
tokio.workspace = true

# Mirrors mogwai-data's two-level indirection; see the note there. `hotpath`
# also forwards to mogwai-data's own feature, because a projection profile that
# stopped at the crate boundary would attribute the whole parent walk to one
# frame - the walk is the other half of what a screen cell spends.
[features]
hotpath = ["dep:hotpath", "hotpath/hotpath", "mogwai-data/hotpath"]

# The tree-state seam in `delivery` - `TreeOracle`, `install_tree_oracle`,
# `ScriptedTree`. OFF BY DEFAULT AND IT MUST STAY OFF, because installing a
# double lets a caller fabricate the `harness_tree_commit` an artifact's
# binding is attested with. `mogwai-cli` enables it in [dev-dependencies]
# only; under resolver 3 that does not reach a build compiling no test target,
# so the shipped `target/release/mogwai` has no installation point at all.
# See the module comment in `delivery.rs` for the second, runtime guard.
test-seam = []
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "mogwai-data/hotpath-alloc"]

# The layer-2 projection instrument. `required-features` is what stops a plain
# `--examples` build from producing a binary named for profiling that measures
# nothing: without the feature the annotations compile away and the harness
# would run, report an empty table, and look like a finding.
[[example]]
name = "screen_projection_bench"
required-features = ["hotpath"]

[[example]]
name = "stage_a_batch_bench"

# No `required-features`: its canonical output is a WALL and a per-month unit
# price, which an instrumented build would distort. `--hotpath` on this target
# is opt-in through the call site's own `--features`.
[[example]]
name = "envelope_evaluation_bench"

[lints]
workspace = true
