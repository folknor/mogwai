[package]
name = "mogwai-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

# The corpus/evidence layer of the Python-to-Rust rewrite (phase 1 of
# notes/rust-rewrite-phases.md): the TBBO stream contract, session/segment
# math, ledger-bound input verification and preflight, plus the storage
# policy (artifact/cache/scratch). Deliberately depends on none of
# mogwai-data, mogwai-protocol, mogwai-engine or mogwai-adapter - it never
# touches the tape or venue paths, so it carries no TAPE_PROTOCOL_VERSION
# obligation of its own (mirrors why measure12a.rs stays consumer-only
# inside mogwai-server rather than exporting from mogwai-data).
[dependencies]
serde.workspace = true
serde_json.workspace = true
zstd.workspace = true
sha2.workspace = true

[lints]
workspace = true
