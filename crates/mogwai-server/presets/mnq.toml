[instrument]
symbol = "MNQ"
price_precision = 2
size_precision = 0
price_increment = "0.25"
size_increment = "1"
[instrument.class]
kind = "future"
underlying = "NQ"
settlement_currency = "USD"
multiplier = "2"
asset_class = "index"
[instrument.margin]
initial_per_contract = "2000"
maintenance_per_contract = "1800"
breach_action = "liquidate"
[instrument.generator]
symbol = "MNQ"
modal_tick = "0.25"
price_decimals = 2
mean_event_duration_s = 0.17104059420590498
children_mean = 8.49053255324216
children_single_frac = 0.5586834546003685
levels_mean = 2.2471110339199503
size_round_frac = 0.20856767610054022
start_price = "21000"
# This is the continuous lognormal's center before the whole-contract grid.
# Keeping it in contracts is the point: the removed mean-notional proxy made
# the same setting mean quote currency for spot and contracts for futures.
latent_size_median = "1"
vol_scalar = 0.000001
# Exchange-local CME hours: Sunday 18:00 through Friday 17:00 Chicago time,
# with the daily 16:15-16:30 maintenance halt and the 17:00-18:00 break, and a
# genuinely shut Saturday. Minutes count from local Sunday 00:00. Local minute
# 960 is 16:00, when the daily settlement price is struck; without this table
# the instrument would carry margin it never settles.
[instrument.calendar]
utc_offset_minutes = -300
settlement_minute_of_day = 960
open_windows = [
  { start_minute = 1080, end_minute = 2415 },
  { start_minute = 2430, end_minute = 2460 },
  { start_minute = 2520, end_minute = 3855 },
  { start_minute = 3870, end_minute = 3900 },
  { start_minute = 3960, end_minute = 5295 },
  { start_minute = 5310, end_minute = 5340 },
  { start_minute = 5400, end_minute = 6735 },
  { start_minute = 6750, end_minute = 6780 },
  { start_minute = 6840, end_minute = 8175 },
  { start_minute = 8190, end_minute = 8220 },
]
