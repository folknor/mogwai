[package]
name = "mogwai-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
rust_decimal.workspace = true
# The launcher parses the venue's readiness line, so this is a runtime dep
# rather than a test-only one.
serde_json.workspace = true
# The launcher announces the run it started. `log` bridges the event onto the
# `log` facade for hosts that install one and no tracing subscriber, which is
# the common shape for a nautilus host.
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]

# The wire-decode cost probe behind `reference/performance.md`'s tag-decode
# table. No `required-features`: it counts allocator calls with its own
# wrapping global allocator, so an instrumented build would measure the
# profiler's allocator instead of serde's.
[[example]]
name = "tag_decode_probe"

# The symbol-representation probe behind `reference/performance.md`'s inline
# `Symbol` table, which refused that change. No `required-features` for exactly
# the same reason as above: it wraps the global allocator too, so an
# instrumented build would count the profiler's allocator rather than serde's.
# It is deliberately NOT a `brokkr mogwai` target either - `brokkr.toml` records
# why beside the other non-registrations.
[[example]]
name = "symbol_decode_probe"

[lints]
workspace = true
