[package]
name = "mogwai-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# This is the sole mogwai crate that imports nautilus. The broker core crates
# stay protocol-native; this adapter is the host-facing client pair and
# depends on the published crates.io releases, not the read-only research
# snapshot and no longer the sibling checkout.
[dependencies]
mogwai-data.workspace = true
mogwai-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait = "0.1.91"
futures-util.workspace = true
# The request bounds nautilus hands the data client are `jiff::Timestamp` as of
# 0.62, so mapping them onto the u64 nanosecond axis needs jiff by name.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
rand = "0.10.2"
rust_decimal.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.30.0"
# The `log` feature bridges this crate's `tracing` diagnostics onto the `log`
# facade. A nautilus trading host typically installs nautilus_common's global
# `log` backend and NO tracing subscriber, so without this bridge every
# `tracing::warn!` here (dropped fills/positions, the
# A.11 unsurfaced rejects, unrepresentable balances, and omitted status reports)
# is discarded unseen. With it, tracing events fall back to emitting `log` records
# when no subscriber consumes them, so they reach the worker log alongside
# nautilus' own lines; where a subscriber IS present (mogwai-server) they still
# go there instead.
tracing = { workspace = true, features = ["log"] }
ustr = "1.1.0"

nautilus-common = { version = "0.62.0", default-features = false }
nautilus-core = { version = "0.62.0", default-features = false }
nautilus-live = { version = "0.62.0", default-features = false }
nautilus-model = { version = "0.62.0", default-features = false }
nautilus-network = { version = "0.62.0", default-features = false }

[dev-dependencies]
serde_urlencoded = "0.7"

[lints]
workspace = true
