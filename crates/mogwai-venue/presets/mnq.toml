symbol = "MNQ"
price_precision = 2
size_precision = 0
price_increment = "0.25"
size_increment = "1"
[instrument.class]
kind = "future"
underlying = "NQ"
settlement_currency = "USD"
multiplier = "2"
asset_class = "index"
[instrument.margin]
initial_per_contract = "2000"
maintenance_per_contract = "1800"
breach_action = "liquidate"
# Fitted from the delivered July 2026 MNQ TBBO month (job
# GLBX-20260805-HAPEWPABKG, 22 usable sessions, 29.6M parents over 34.7M
# sided prints) under the frozen harness of the retired Python fit
# implementation; the fit
# artifact analysis/mnq-fit.json carries every estimator definition,
# solve record and per-target verdict. Estimator summaries: cadence is
# pooled over inferred parents (contiguous timestamp-plus-side runs,
# halt- and session-boundary gaps excluded); the size median is
# inverse-solved through the materialization path jointly with
# size_log_sigma; the quote seams are parent-weighted at trade instants
# (TBBO observes the book only when trades happen - a trade-conditioned
# BBO, not a time-weighted one); the displacement scalar is
# inverse-solved so the generated parent-level effective displacement
# median matches the observed 1.025 ticks; vol_scalar targets the pooled
# RMS of adjacent-parent quote-mid log returns; start_price is the last
# valid trade of the final usable session, an observed terminal anchor.
# The landing is partial by verdict: the eight cadence, quote and anchor
# targets carry fitted provenance; the size pair and vol_scalar carry the
# solver's best candidates under declared provenance because one frozen
# gate each refused them - see the per-entry rationales below.
[instrument.generator]
symbol = "MNQ"
modal_tick = "0.25"
price_decimals = 2
# Tape protocol 32: the mean parent gap the cascade below centres on. The
# year's median session prints 1,478 contracts a minute over its 1,380
# minutes, and the July TBBO fit puts 1.98 contracts on a parent (1.17
# children at a 1.69-contract mean), so the reference minute holds 747
# parents. The July value of 0.0609 was the protocol-31 level defect: a
# tape 1.7 times the year's median in every phase.
mean_event_duration_s = 0.08032128514056225
# Tape protocol 33: the sweep refit on the year's tbbo, median across
# fourteen month blocks (`analysis/tape-v2` micro-stats). A parent is one
# `(ts_event, side)` run of prints; 91.4 percent are one print, the mean
# is 1.159, and a multi-print parent spans more than one level nine
# times in ten (a CME trade summary is one print per level), which is
# what levels_mean encodes: 1 + 0.9 * (children_mean - 1).
children_mean = 1.159
children_single_frac = 0.914
levels_mean = 1.143
# Structurally unidentifiable on the whole-contract grid at a one-lot
# median (integral_lot is 1, both size arms materialize identically), so
# it remains declared; the fit artifact records the moot branch with its
# precondition values.
size_round_frac = 0.20856767610054022
start_price = "28284.00"
# This is the continuous lognormal's center before the whole-contract grid.
# Keeping it in contracts is the point: the removed mean-notional proxy made
# the same setting mean quote currency for spot and contracts for futures.
latent_size_median = "1.097264"
# The joint size solve's best candidate (sigma grid point 0.9333 with its
# nested median), carried as the closest representable approximation: the
# family's ecdf, mean and p90 checks pass and generated p99 improved from 14
# to 10 contracts against observed 8, one contract over the frozen bound, so
# the pair stays declared rather than fitted. Stated explicitly also so the
# harness can override the sigma path - overriding an unset path is refused.
size_log_sigma = 0.9333333333333333
# The protocol-11 frozen solver's best candidate for the pooled quote-mid
# RMS target, re-solved with the fitted per-parent session arrays installed
# (the flattened vol_hour redistributes scale, so the scalar rises from the
# protocol-10 candidate 8.70e-6). The pooled RMS gate passes around it; the
# per-seed minute-range envelope gates still fail (p99.9 433-607 ticks vs
# the resampled observed bound; per-seed max to 3614 vs 968), so the value
# stays declared: the t(4)/GARCH cluster-tail shape overproduces extreme
# minutes and no scalar can land a shape. The protocol-12 tail spec owns
# the fix, and inherits the hourly wall-time contour evidence beside it.
vol_scalar = 0.000013570223097752063
quoted_width = { ticks = 2, provenance = { kind = "fitted", corpus = "MNQ.v.0 GLBX.MDP3 TBBO 2026-07, job GLBX-20260805-HAPEWPABKG" } }
top_sizes = { bid = "3", ask = "3", provenance = { kind = "fitted", corpus = "MNQ.v.0 GLBX.MDP3 TBBO 2026-07, job GLBX-20260805-HAPEWPABKG" } }
depth_levels = { levels = 8, provenance = { kind = "uncalibrated" } }
depth_growth = { growth = "1", provenance = { kind = "uncalibrated" } }
trade_displacement_ticks = { ticks = 0.5161290322580645, provenance = { kind = "fitted", corpus = "MNQ.v.0 GLBX.MDP3 TBBO 2026-07, job GLBX-20260805-HAPEWPABKG" } }
# The activity cascade, tape protocol 32: the synthetic tape v2 walk. Its
# presence is what selects it; the arrival clock, the GARCH mid and the
# bounce/drift process above it do not run on this preset. The mechanism
# is stated in `mogwai_data::generated::cascade`; what is fitted here was
# measured on 260 full MNQ sessions of one-minute bars (2025-08-19 to
# 2026-09-03) with `analysis/tape-v2/residuals.py` and `price_targets.py`,
# and checked against the same on the prototype `proto_engine.py`.
#
# - The texture is the envelope-normalised minute-volume residual: lognormal
#   to two decimals in every phase, log-sd 0.70 in Asia and 0.36 at the cash
#   open, which `texture_amplitude * v^(-texture_exponent)` reproduces. Its
#   autocorrelation (0.52, 0.39, 0.27, 0.20, 0.17, 0.09, 0.03 at lags 1, 2,
#   5, 10, 15, 30, 60 minutes in Asia) is a mixture of five timescales, and
#   the whole-session autocorrelation (0.18, 0.11, 0.03 at one, two and
#   four hours) wants a sixth at three hours, the swell a night rides. The
#   weights are stated at the second level, where the 15-second component
#   keeps about half its variance in a minute average.
# - A jump follows the square root of the minute sd where it lands: real
#   Asia's largest minute in the year is 140 points and the cash open's
#   197 across a threefold spread in minute sd, and only four Asia minutes
#   exceed 100. Every real minute over 100 points came with volume, two to
#   ten times the phase median, which the kick on the fastest texture
#   components supplies. The jump rate follows the envelope and the slow
#   level, never the texture, so a jump's own volume cannot raise the
#   chance of the next one.
# - The level is the per-session mean minute volume: log-sd 0.34 across the
#   year, day-to-day autocorrelation 0.78, 0.66, 0.55, 0.48, 0.28 at lags 1,
#   2, 5, 10, 20 sessions, which three components of a session, a week and a
#   month give.
# - The per-parent sigma level follows the volume level to the 0.57 power
#   with its own 0.207 log-sd (range level log-sd 0.42, correlation 0.87
#   with the volume level).
# - `event_log_sigma` is 0.21 points at the 28,284 start price: the year's
#   one-minute close-return sd per phase (5.9 Asia, 17.1 open, 10.7 midday)
#   at 747 parents a minute under the range shape.
# - Jumps at three a session, four reference sds, are what put the
#   standardised minute kurtosis at the real nine and the largest minute of
#   a session near the real 82 points.
# - The gap is lognormal: the real reopen gap is 9.6 points at the median,
#   63 at p90, 316 at p99, and the largest in the year is 541; the draw is
#   clamped at 2.75 sds so the law's tail past what a year shows is not
#   printed.
# - Below the minute, tape protocol 33, fitted on the year's tbbo (260
#   million prints in fourteen month blocks, `analysis/tape-v2` micro-stats
#   and proto_micro.py). The real seconds inside a minute are dispersed 5.5
#   times Poisson in Asia and 15 at the cash open, which a fast texture at
#   three seconds with log-sd 0.45 gives on top of the minute texture (the
#   prototype wanted 0.55 at a cash-open rate it had set a third low; the
#   dispersion of a multiplicative texture grows with the rate, and the
#   engine at the real rate lands the open's 15 at 0.45); and
#   inside a second the real tape clusters where a Poisson placement is flat:
#   a fifth of all parent gaps are under a millisecond at every hour, and
#   100 ms bins are dispersed 2.7 to 4.0 times uniform. The branching below
#   supplies that: every parent spawns children at a fifth of a millisecond
#   (the engine's follow-on prints), thirty milliseconds and a second, with a
#   total branching ratio of 0.6, so immigrants are 40 percent of parents.
#   The fit is the mean absolute log miss over twelve gap, normalised-gap
#   and dispersion statistics across Asia, London, the cash open and the
#   close: 0.26 at this point, against 1.0 for the uniform placement of
#   protocol 32, whose within-second dispersion is one by construction.
# - The aggressor side has a slow memory: autocorrelation 0.147 at lag 1,
#   0.069 at 2, 0.026 at 5, 0.018 at 10, 0.010 at 50, 0.007 at 100, a run
#   of ten or more one time in ninety where the Markov chain at the same
#   lag-1 gives one in a hundred and forty. Five live metaorders with a
#   Pareto print count of exponent 2.2 and an 8 percent outright repeat
#   land every one of those within the month-to-month spread.
[instrument.generator.cascade]
texture_tau_minutes = [0.25, 1.0, 5.0, 25.0, 90.0, 180.0]
texture_weights = [0.46, 0.12, 0.16, 0.11, 0.03, 0.12]
texture_amplitude = 0.54
texture_exponent = 0.24
fast_texture_tau_s = 3.0
fast_texture_log_sd = 0.45
excitation_ratio = [0.22, 0.08, 0.3]
excitation_tau_s = [0.0002, 0.03, 1.0]
sign_slots = 5
sign_alpha = 2.2
sign_repeat = 0.08
# - Tape protocol 34: a parent's impact on the mid, a propagator. The
#   real signed mid move after a parent is 0.48 ticks one parent later,
#   0.65 at ten and 0.66 at a hundred, in every phase; before this the
#   tape's mid ignored the side. A parent now kicks the mid 0.45 ticks its
#   own way, of which 0.30 stays and 0.15 decays at 0.98 per later parent
#   (`proto_impact.py` on the splitting sign model: response 0.45, 0.63
#   and 0.68 at those lags). The growth from one to ten parents is the
#   sign memory, the flatness past ten the transient decaying against it.
#   The term supplies about a quarter of the open's minute variance and a
#   sixth of Asia's, which event_log_sigma gives up below.
impact_permanent_ticks = 0.3
impact_transient_ticks = 0.15
impact_transient_decay = 0.98
level_tau_minutes = [420.0, 8640.0, 47520.0]
level_weights = [0.2, 0.3, 0.5]
level_log_sd = 0.34
sigma_level_exponent = 0.57
sigma_level_log_sd = 0.207
# Protocol 34: 0.00000742 less the share the propagator supplies over a
# minute, a tenth of the sd.
event_log_sigma = 0.0000067
student_df = 4.0
gap_median_ratio = 1.2
gap_log_sd = 1.6
gap_log_clamp_sd = 2.75
jumps_per_session = 3.0
jump_size = 3.5
jump_log_sd = 0.7
jump_log_clamp_sd = 2.75
jump_volume_kick = 1.5
jump_local_exponent = 0.5
# Intraday shape, refitted at protocol 11 from the July 2026 MNQ TBBO
# month in the units the runtime actually applies (the protocol-8 NQ-bar
# curves were per-minute quantities applied per parent event, which made
# the generated minute-level peak-to-trough the product of both swings -
# the roughly-5x-too-quiet overnight the owner's chart review found).
# These factors are relative and conditional on the market being open: the
# calendar below owns whether an event may exist at all, and this table
# owns how intense it is given that it may. The modulator divides the
# composite by its own exposure-weighted mean over the calendar's open
# minutes, so the arrays satisfy no particular sum and any positive
# rescaling of them is equivalent.
#
# Since protocol 31 these hourly curves are not what this preset runs on:
# the calendar below carries a per-minute-of-session envelope, and the
# modulator reads that instead whenever one is declared. The arrays stay
# because the schema requires them, because the fit they record is the
# protocol-11 evidence, and because a preset that inherits this one and
# drops the envelope falls back to them.
#
# Estimators, definitions in the fit artifact analysis/mnq-fit.json:
# - intensity_hour is the conditional hour parameter under the frozen
#   dow_weight: inferred-parent counts per (hour, day) cell divided by
#   dow-weighted calendar exposure, so the runtime's hour-times-day
#   product does not double-count day concentration. Fitted per-hour
#   marginal reproduction on the generated month: worst hour 0.63 percent.
#   Peak-to-trough 14.5x - real parent counts, not the volume proxy whose
#   27.51x was a stated upper bound.
# - vol_hour is the per-parent robust scale: one-maximum-trimmed mean
#   absolute adjacent-parent quote-mid log return per session-hour cell,
#   median across the 22 sessions. The curve is nearly flat and slightly
#   inverted: overnight parents individually move a little more than
#   cash-session parents - which is what the per-minute proxy could never
#   see. Worst generated-vs-observed hour: 6.6 percent.
#
# Limitations, none of which the fitted/corpus/window provenance schema can
# structurally carry:
#
# - Hour 21 UTC is unexposed (the 16:00-17:00 Central daily break); its 1.0
#   is a convention, not a measurement. Hour 20 was fitted with 45 open
#   minutes per session, around a 15:15-15:30 halt the calendar no longer
#   carves.
# - dow_weight is untouched by the protocol-11 refit and keeps its NQ-bar
#   provenance and caveats: Saturday's 1.0 is a zero-exposure convention,
#   Sunday rests on an order of magnitude less exposure than any weekday,
#   and 22 July sessions are too thin for a preregistered weekday refit.
# - The hourly 60s and 300s wall-time contour of the generated month misses
#   its frozen 0.8-1.25 band at the reversion-heavy hours (300s at UTC 19,
#   20, 23) even though arrival and per-parent scale match to fractions of
#   a percent there: an hour-dependent aggregation-law mismatch recorded in
#   the fit artifact, inherited by the protocol-12 tail spec as a hard
#   successor gate. The pooled 60s and 300s RMS pass.
# - The profile is conditional on the permanent-CDT calendar below. Refitting
#   it against a different calendar, or changing that calendar, invalidates
#   it.
[instrument.session]
intensity_hour = [
  0.788959, 0.606801, 0.476029, 0.404415, 0.33337, 0.389075, 0.370589,
  0.385735, 0.425944, 0.289761, 0.286266, 0.428253, 0.677683, 3.200686,
  4.138113, 2.546961, 1.723787, 1.314281, 1.292247, 1.624038, 0.470938,
  1.0, 0.33058, 0.357795,
]
# Sun, Mon, Tue, Wed, Thu, Fri, Sat
dow_weight = [1.5179, 0.9080, 0.9865, 1.0157, 1.0535, 1.0225, 1.0000]
vol_hour = [
  1.110005, 1.07247, 1.059488, 0.991918, 1.024188, 1.091588, 1.090355,
  1.119903, 1.1612, 1.12323, 1.075567, 1.044929, 1.036215, 0.975501,
  0.939166, 0.871242, 0.845352, 0.82815, 0.81192, 0.840464, 0.939231,
  1.0, 1.001102, 0.931623,
]

# Exchange-local CME equity-index hours on a permanent CDT clock: Sunday 17:00
# through Friday 16:00 Chicago time, with the 16:00-17:00 daily break and a
# genuinely shut Saturday. Minutes count from local Sunday 00:00. Local minute
# 900 is 15:00, when the daily settlement price is struck; without this table
# the instrument would carry margin it never settles.
#
# The offset is fixed at -300 and DST transitions are unmodelled, so the model
# week is CDT all year. Half of a real calendar year is CST, and those sessions
# occur one UTC hour later than this table places them. That is a stated
# limitation of the fixed-offset model, not an approximation that averages out.
#
# These figures previously read 18:00-17:00 with a 16:15-16:30 halt, which was
# the same schedule rendered one hour forward - the winter UTC instants shown on
# a CDT clock. It described no civil session CME publishes, and the comment
# calling it Chicago time was wrong: CME equity index opens at 17:00 Central,
# not 18:00. Correcting it moved settlement from 960 to 900, which is the same
# real instant rather than a new choice.
#
# Until protocol 31 the table also carved a 15:15-15:30 halt out of every
# session. The exchange's own `status` feed shows no such halt: for ES on
# 2026-08-18 it records trading from 17:00, closed at 16:00, pre-open quoting
# at 16:45 and the no-cancel period at 16:59:30, and nothing else; and real
# MNQ prints in every one of those fifteen minutes. The halt was a schedule
# CME no longer runs, and the calendar now trades straight through to 16:00.
[instrument.calendar]
utc_offset_minutes = -300
settlement_minute_of_day = 900
open_windows = [
  { start_minute = 1020, end_minute = 2400 },
  { start_minute = 2460, end_minute = 3840 },
  { start_minute = 3900, end_minute = 5280 },
  { start_minute = 5340, end_minute = 6720 },
  { start_minute = 6780, end_minute = 8160 },
]
# The L0 activity envelope: per-minute-of-session shape, fitted as
# the median over 260 full sessions.
# Corpus: MNQ front month, GLBX.MDP3 ohlcv-1m with definition, Databento batch corpus on speilegg.
# Window: 2025-08-19 through 2026-09-03, 260 full sessions.
# `volume` is normalised so the session's mean minute is 1.0 and
# `range` so the session's median minute is 1.0; the generator
# derives its per-parent volatility multiplier from the two as
# range / sqrt(volume). Minute 0 is the 17:00 Chicago reopen, 930
# the 08:30 cash open, 1320 the 15:00 settlement. Level is not
# carried here: it is a slow regime and belongs to the driver.
[instrument.calendar.envelope]
session_open_minute_of_day = 1020
