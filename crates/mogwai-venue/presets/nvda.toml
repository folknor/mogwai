[instrument]
symbol = "NVDA"
price_precision = 2
size_precision = 0
price_increment = "0.01"
size_increment = "1"

[instrument.class]
kind = "equity"
currency = "USD"
multiplier = "1"

# The generator states the one scalar this preset actually knows: a share
# costs about 180 dollars. Every other scalar defaults from the committed
# fingerprint medians with the tick grid, price decimals and top sizes forced
# to this definition, so the default shape keeps the crypto-fitted cadence and
# size proportions at an equity price level rather than opening near sixty
# thousand dollars a share. No session table: the default bundle serves every
# unmatched label and makes no session claim.
[instrument.generator]
start_price = "180"

[provenance]
"symbol" = { kind = "declared", rationale = "the default shape's label" }
"price_precision" = { kind = "declared", rationale = "US equity quote grid, cents" }
"size_precision" = { kind = "declared", rationale = "shares are whole units" }
"price_increment" = { kind = "declared", rationale = "US equity quote grid, cents" }
"size_increment" = { kind = "declared", rationale = "one share" }
"class.kind" = { kind = "declared", rationale = "cash equity" }
"class.currency" = { kind = "declared", rationale = "US listing, USD settled" }
"class.multiplier" = { kind = "declared", rationale = "one share per contract" }
"generator.start_price" = { kind = "declared", rationale = "typical large-cap US equity share price level; order-of-magnitude honesty, not a fit" }
