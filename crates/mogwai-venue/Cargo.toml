[package]
name = "mogwai-venue"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

# A library crate. The `mogwai` binary lives in `mogwai-cli`, which depends on
# this one for `serve`, config loading and the instrument profiles.

[dependencies]
mogwai-protocol.workspace = true
mogwai-engine.workspace = true
mogwai-data.workspace = true

rand.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rust_decimal.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }

[dev-dependencies]
# `test-util` for the paused clock. The history slot gate now WAITS up to
# `HISTORY_SLOT_WAIT`, and its deadline test has to reach that instant
# without the suite actually sleeping through it.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
