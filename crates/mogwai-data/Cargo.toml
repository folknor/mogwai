[package]
name = "mogwai-data"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
mogwai-protocol.workspace = true
rust_decimal.workspace = true
rand.workspace = true
rand_distr.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
# Emit-only: this crate raises `tracing` events (the Kraken CSV skip paths, the
# dropped already-elapsed ReopenGap) and never installs a subscriber. The
# workspace entry carries tracing's default features, matching mogwai-venue;
# mogwai-adapter's extra `log` feature is its own, needed because its nautilus
# host runs a `log` backend with no subscriber.
tracing.workspace = true
hotpath = { workspace = true, optional = true }

# The two-level feature indirection: a crate feature that forwards to the
# dependency's own. Consumers name `mogwai-data/hotpath` and never have to know
# that arming the macros is a feature on a third crate.
#
# `hotpath-alloc` enables BOTH sides deliberately. hotpath's alloc tracking
# only reports through the timing machinery, so alloc alone measures nothing;
# a feature that silently does nothing is worse than one that costs a little
# more than asked.
[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dev-dependencies]
criterion.workspace = true

# Examples are declared rather than auto-discovered, so the instrumented one
# can carry `required-features`. Declaring one target turns auto-discovery off
# for the rest, which is why the two pre-existing examples are listed too.
[[example]]
name = "peek"

[[example]]
name = "fill_walk_bench"

# The layer-2 walk instrument: the parent draw with no projection attached.
[[example]]
name = "arrival_walk_bench"
required-features = ["hotpath"]

# The amendment-only regenerator for the committed arrival transcript pins.
# It is an example rather than an `#[ignore]`d test BECAUSE the gate profile
# sets `include_ignored`, so an ignored test that writes a fixture is run by
# every full gate - see the file's own header.
[[example]]
name = "regenerate_arrival_transcript"

[lints]
workspace = true
