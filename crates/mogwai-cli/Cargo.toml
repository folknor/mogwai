[package]
name = "mogwai-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The binary is `mogwai`, not the package name `mogwai-cli`. The target name is
# load-bearing well beyond convenience: `brokkr run mogwai`, the shipped
# launcher in `mogwai-protocol` and the docs all key on it. The Python
# measurement harness execd `target/release/mogwai` directly too, until phase 4b
# retired it - so that particular silent breakage is no longer possible, but the
# remaining consumers still key on the name.
[[bin]]
name = "mogwai"
path = "src/main.rs"

[dependencies]
mogwai-server.workspace = true
mogwai-protocol.workspace = true
mogwai-data.workspace = true
mogwai-lab.workspace = true

clap = { version = "4.6.3", features = ["derive", "string"] }
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
anyhow.workspace = true
humantime = "2"

# `mogwai man` renders the bundled reference/*.md docs to the terminal.
owo-colors = "4"
pulldown-cmark = "0.13"

[dev-dependencies]
# THE SAME DEPENDENCY AS ABOVE, WITH ONE FEATURE ADDED, and the placement is
# the whole mechanism: the dirty-tree unit tests in `fit`, `arrival_control`,
# `arrival_screen` and `minute_range_envelope` install a scripted tree reader,
# and that reader must not exist in the binary this crate ships. Under
# resolver 3 a dev-dependency's features are unified only into builds that
# compile a test target, so `cargo build --release` leaves `test-seam` off.
mogwai-lab = { workspace = true, features = ["test-seam"] }
mogwai-protocol.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde_json.workspace = true
# `tests/gate_skip_list.rs` reads the project config as DATA, to hold its skip
# list against the tests that actually match it.
toml.workspace = true
tungstenite = "0.30.0"
tokio-tungstenite = "0.30.0"
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }

[lints]
workspace = true
