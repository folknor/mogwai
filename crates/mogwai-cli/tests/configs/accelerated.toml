#
# The slow-start gate's venue, per decision 8. A large warmup, a fast clock and
# a short declared duration: if the run deadline were measured from boot rather
# than from the post-warmup `started_ns`, the accelerated duration would elapse
# during warmup generation and the run would be over before the launcher could
# connect. It must instead serve its whole declared duration after readiness.

speed = 100.0

# Six simulated hours of warmup, generated before the readiness line.
warmup_ns = 21600000000000
