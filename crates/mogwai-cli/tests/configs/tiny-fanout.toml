#
# The lag-policy gate's venue. The bounded fanout ring and its kill-the-slow-
# connection policy survive the tenancy rip - one consumer still holds sockets
# onto one tape - so they have to stay reachable. At the shipped 4096-frame
# depth reaching the policy means driving hours of tape through a stalled
# socket; at 8 it is one stalled read away.

warmup_ns = 60000000000

# Unthrottled, so the ring overruns a non-reading peer promptly.
speed = 0.0
fanout_depth = 8

# Do not park the unpaced tape for a peer that cannot keep up. The park exists
# so a healthy slow consumer is never the reason a firehose stalls, and it is
# effective enough that with it on, a merely-slow reader is never ejected at
# all. Zero removes it, which is what puts the ring's own overrun policy - one
# stall, then ejection - one stalled read away instead of hours of tape away.
