#
# The declared-duration gates' venue. It is fast.toml with one thing changed,
# the pacing: `speed = 1.0` rather than 0.0.
#
# Those gates give the venue a `--duration` and then wait on a socket for the
# `RunComplete` the venue writes at its deadline. On an unpaced venue - which is
# every `speed = 0.0` fixture beside this one - that announcement is queued
# behind the whole market backlog the run generated flat out, and the consumer
# has to drain the backlog before it can see the frame. Measured on fast.toml:
# 1,475,111 frames on one socket in the 2 s of a declared run, against a consumer
# draining about 111,000 a second, so clearing it takes essentially the test's
# entire wall budget - and under load it does not clear at all. The test then
# reports that the run never announced its completion, which is a wrong answer
# about the venue produced by a fixture choice.
#
# It is not that the gates were waiting too little. It is that nothing about
# `RunComplete` is a claim about unpaced delivery, so the firehose is pure cost
# and pure risk. At speed 1.0 the declared 2 s of simulated time is 2 s of wall
# carrying 2 s of tape - about a hundred frames - and the announcement lands
# immediately after them.
#
# The general shape, worth recognizing before it is diagnosed again: any test
# waiting for something the venue writes at the tail of a span of unpaced tape
# is on this same trap, whatever that something is. The frame is not late, it is
# behind a backlog nobody needed generated.
#
# `speed = 0.0` stays everywhere else. The serving gates assert on what arrives
# rather than on its cadence, and waiting out real inter-trade gaps would make
# every one of them slower for nothing.

# Pinned for the same reason fast.toml pins it: two venues launched from this
# file serve the same realization.
seed = 42

# Five simulated minutes of history, materialized at boot, as fast.toml.
warmup_ns = 300000000000

# Real time, which is the whole point of this file. Declared simulated durations
# are then wall durations too, so a `--duration 2s` gate costs 2 s.
speed = 1.0

symbol = "BTCUSDT"

[balances]
USDT = "100000"
USD = "100000"

# A second river, so the gate that asserts each socket receives its own boat's
# instant has two boats to compare. A single-river config could not express that
# property at all.
#
# What separates the two boats is their wall anchor, not their speed. An earlier
# version of this comment claimed the second river is "placed at a different
# speed by the test's own query string", and that was false on its face - this
# file is `speed = 1.0` and the query asks for `speed=1`, the same number.
# `boatyard.rs` gives every boat `sim_epoch_ns = origin_ns`, identical, and
# `wall_anchor_ns = now_ns()` AT BOAT CONSTRUCTION, so two boats built at
# different instants read different sim-now at the same wall instant. That is
# the difference the gate's `assert_ne!` is sensitive to, and it is what a
# shared-clock regression would erase.
#
# The pacing puts a liveness requirement on both sockets, which unpaced delivery
# used to hand over for free, so it was measured rather than assumed - the
# watcher discards a run where any socket saw no content frame, and a river too
# quiet to print inside the declared window would discard every run and report
# it as host load. Over six runs at seed 42, deterministic to the millisecond:
# MNQ served 89 content frames, the first 171 ms after attach, longest gap
# 519 ms; the BTCUSDT boot river is the sparser of the two at 16 frames, first
# one 1.031 s after attach, which is also its longest gap. Both fit a declared
# 2 s, the boot river with about a second to spare, and that second is the real
# margin here - not MNQ's, which was the socket suspected.
[symbols.MNQ]
preset = "MNQ"
