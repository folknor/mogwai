[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97"
authors = ["folknor"]
repository = "https://github.com/folknor/mogwai"

[workspace.dependencies]
mogwai-protocol = { path = "crates/mogwai-protocol" }
mogwai-engine = { path = "crates/mogwai-engine" }
mogwai-data = { path = "crates/mogwai-data" }
mogwai-server = { path = "crates/mogwai-server" }
mogwai-lab = { path = "crates/mogwai-lab" }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rand = "0.10.2"
rand_distr = "0.6"
# Explicit ChaCha12 RNG for the generator. rand 0.10's StdRng is ChaCha12 too but
# dropped Clone, and chacha20's RNG zeroizes on drop so it is not Clone either;
# rand_chacha's ChaCha12Rng is a plain struct that is Clone, seekable (word
# position), seedable and deterministic - the substrate the checkpointed seek
# (CheckpointIndex) needs. rand_core 0.10, so rand_distr 0.6 sampling composes.
rand_chacha = "0.10"
# Streaming .csv.zst decode for the mogwai-lab corpus reader. Bindings over
# libzstd (not a pure-Rust decoder): the corpus files are tens of GB and the
# offline Python reference already uses the equivalent C library
# (compression.zstd, stdlib since 3.14), so this keeps decode throughput and
# format coverage identical rather than trusting a reimplementation.
zstd = "0.13"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Bench harness, dev-only. default-features off drops plotters and rayon, which
# only serve the HTML report this workspace does not produce; cargo_bench_support
# is what lets criterion_main run outside `cargo bench`, which the benches need
# because they ship as example targets driven through brokkr.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"
