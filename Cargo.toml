[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99"
authors = ["folknor"]
repository = "https://github.com/folknor/mogwai"

[workspace.dependencies]
mogwai-protocol = { path = "crates/mogwai-protocol" }
mogwai-engine = { path = "crates/mogwai-engine" }
mogwai-data = { path = "crates/mogwai-data" }
mogwai-server = { path = "crates/mogwai-server" }
mogwai-lab = { path = "crates/mogwai-lab" }

serde = { version = "1", features = ["derive", "rc"] }
# `float_roundtrip` is NOT optional dressing here. serde_json's default float
# parser is a fast approximation that can land one ULP off the correctly
# rounded value: `from_str("12.344540150041679")` produces a different f64
# than `str::parse` (and than Python's `float()`). The protocol-12a parity
# gates compare committed JSON records leaf-by-leaf against freshly computed
# f64s, so a sloppy parse manufactures divergences that are not in the data -
# it cost one debugging round on exactly that. The feature makes parsing
# correctly rounded; writing was already exact (ryu).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
toml = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rand = "0.10.2"
rand_distr = "0.6"
# Explicit ChaCha12 RNG for the generator. rand 0.10's StdRng is ChaCha12 too but
# dropped Clone, and chacha20's RNG zeroizes on drop so it is not Clone either;
# rand_chacha's ChaCha12Rng is a plain struct that is Clone, seekable (word
# position), seedable and deterministic - the substrate the checkpointed seek
# (CheckpointIndex) needs. rand_core 0.10, so rand_distr 0.6 sampling composes.
rand_chacha = "0.10"
# Streaming .csv.zst decode for the mogwai-lab corpus reader. A pure-Rust
# zstd implementation, replacing the former libzstd bindings: it drops the C
# toolchain from the build. The decoder is level-independent and reads
# standard frames from any encoder, so the corpus the offline Python reference
# produces via compression.zstd stays readable here.
zrip = "0.8"
sha2 = "0.11"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Bench harness, dev-only. default-features off drops plotters and rayon, which
# only serve the HTML report this workspace does not produce; cargo_bench_support
# is what lets criterion_main run outside `cargo bench`, which the benches need
# because they ship as example targets driven through brokkr.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
# Function-level profiling for the layer-2 optimization harnesses. An OPTIONAL
# dependency of the two crates that use it, never a plain one: with neither
# crate feature on it must not appear in a consumer's dependency graph at all,
# which "inert when off" does not achieve. Its own `hotpath` feature is what
# arms the macros - without it every annotation compiles to nothing - so the
# entry here turns the default off and the crate features forward it.
hotpath = { version = "0.23", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
future_incompatible = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unused = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
match_same_arms = "deny"
redundant_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
todo = "deny"
