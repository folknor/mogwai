# Example configuration for one foreground run.
sim_epoch_ns = 0
wall_anchor_ns = 0
speed = 1.0
gap_cap_ms = 1000
server_heartbeat_ms = 0
# Sim-time duration of this run. 0 runs indefinitely, until the launcher kills
# the process. Non-zero: the venue serves exactly this much sim time, announces
# RunComplete, and exits 0. `--duration` overrides it.
run_duration_ns = 0

# Sim-time history generated eagerly at boot, before the readiness record is
# written. A history request reaching further back than this is refused with a
# precise error rather than silently served short. Formerly backfill_horizon_ns;
# an operator with an old file renames the key and keeps the value.
warmup_ns = 86400000000000
fanout_depth = 4096
zero_speed_stall_ms = 5000
fill_band_vol_mult = 0.5
fill_band_max_ticks = 200
fill_sweep_interval_ms = 100
exec_held_budget_bytes = 8388608
admission_lane_frames = 64
pending_command_acts = 256
global_pending_command_acts = 4096

# The single instrument this run serves. Omitted, the built-in BTCUSDT profile
# applies. A run serves exactly one, so this is a table and not a list.
# [instrument]
# symbol = "BTCUSDT"

# Market regime for this run. Formerly per-subscription, the one knob a
# consumer picked for itself; with no subscriptions it is boot config chosen by
# whoever launches the run. Omitted, the generator's baseline applies.
# [regime]

# Initial funding. The quote currency of the configured instrument MUST appear
# here, or boot is refused: with one instrument per run, an unfunded quote means
# every buy in the run rejects for insufficient balance.
[balances]
USDT = "1000000"
