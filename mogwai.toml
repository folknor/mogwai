# Example configuration for one foreground run.
speed = 1.0
# The default account: the ledger a connection naming none is served under. A
# run holds one ledger per account id, and a socket may name its own with
# /ws?account=, so this picks the default rather than declaring the venue's one
# account. The consumer asserts it, so it has to be the account the host
# expects. Must be ISSUER-NUMBER: a nautilus AccountId cannot be built from a
# bare word.
account_id = "MOGWAI-001"
# seed = 42 # Absent means a fresh seed is drawn and reported at launch.
venue_heartbeat_ms = 0
# Sim-time duration of this run. 0 runs indefinitely, until the launcher kills
# the process. Non-zero: the venue serves exactly this much sim time, announces
# RunComplete, and exits 0. `--duration` overrides it.
run_duration_ns = 0

# Sim-time history generated eagerly at boot, before the readiness record is
# written. A history request reaching further back than this is refused with a
# precise error rather than silently served short. Formerly backfill_horizon_ns;
# an operator with an old file renames the key and keeps the value.
warmup_ns = 86400000000000
# Broadcast ring capacity. A subscriber falling further behind than this has its
# connection killed as a venue fault. This is the measured protocol 8 default;
# under maximum surge it holds about 0.114 wall seconds, so a surge-exposed run
# should size it deliberately rather than inherit it. See reference/performance.md.
fanout_depth = 1048576
fill_band_vol_mult = 0.005
fill_band_max_ticks = 200
fill_sweep_interval_ms = 100
exec_held_budget_bytes = 8388608
admission_lane_frames = 64
pending_command_acts = 256
global_pending_command_acts = 4096

# The boot symbol selects a matching preset, or the BTCUSDT default when
# unmatched. It is the river boarded at startup and the default for a request
# that names no symbol; any other symbol a consumer asks for is served too.
# symbol = "FOOBAR"
# Default knobs apply to every resolved symbol.
# [instrument]
# preset = "MNQ"
# Per-symbol knobs apply after the defaults.
# [symbols.MNQ]
# preset = "MNQ"

# Market regime for this run. Formerly per-subscription, the one knob a
# consumer picked for itself; with no subscriptions it is boot config chosen by
# whoever launches the run. Omitted, the generator's baseline applies.
# [regime]

# Initial funding, keyed by currency. A shape can only trade if its settlement
# currency is funded here - the quote currency for a spot pair, the
# settlement_currency for a future or a swap. A shape you configured is checked
# at boot and an unfunded one refuses the run. Every shipped preset is resolved
# at boot too, and one whose settlement currency is unfunded is recorded as
# funding-barred: a consumer asking for a symbol that lands on it is refused
# when it binds, rather than having every buy rejected for insufficient balance
# minutes in.
#
# So these default balances fund USDT only, which covers BTCUSDT and every
# unmatched symbol resolving through it, but not the USD-settled MNQ and MES
# bundles. Add USD below for a run whose consumers may ask for the index
# futures. An empty table is the deliberate unfunded run, with funds checks off.
[balances]
USDT = "1000000"
