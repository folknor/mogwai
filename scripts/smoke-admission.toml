# mogwai-server config for scripts/smoke.py --admission.
#
# Everything is the default except the held-lane budget, which is shrunk from
# 8 MiB to 32 KiB - about a dozen orders' worth of held execution output.
#
# The budget is a knob precisely so this end-to-end step exists. At 8 MiB the
# same refusal needs roughly twelve thousand orders held at once (the worst-case
# reservation is released the moment the real batch is serialized, so it is the
# ACTUAL held bytes that must reach the ceiling), which is a load generator, not
# a smoke step. Shrinking the budget changes how soon the venue refuses, not
# what it does when it refuses, so the branch under test is the shipped one.
sim_epoch_ns = 0
speed = 1.0
gap_cap_ms = 1000
server_heartbeat_ms = 0
exec_held_budget_bytes = 32768
