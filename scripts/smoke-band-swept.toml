# An order priced AT the last print cannot be through its trigger on arrival, so
# the fill it eventually gets can only have come from a venue-originated sweep
# pass. That is the whole claim of this mode.
#
# The clock is accelerated for the same reason the in-process sweeper gates run
# at speed 100: the swept fill waits on the NEXT PRINT, and at speed 1.0 the
# fitted BTCUSDT arrival process legitimately dwells tens of seconds - sometimes
# minutes - between prints, so a wall-bounded assertion would be a bet on the
# tape's cadence rather than a gate on the sweeper. At speed 100 every wall
# second buys 100 simulated seconds of tape, which the dwell bound in
# mogwai-data makes a print-rich interval, while the sweep's 5 ms wall floor
# keeps the pass cost bounded.
speed = 100.0
fill_band_vol_mult = 0.005
fill_band_max_ticks = 200
fill_sweep_interval_ms = 50
