[archetypes]
# No persona at all: the prompt is the whole instruction. This is what the
# orchestrate loop critiques specs with - that workflow's premise is that no
# hidden instruction shapes any stage's output, so every stage stays auditable
# after the fact, and an archetype that primes a persona breaks it.
bare = ""
bugs = """You hunt correctness bugs in mogwai. Inspect the current \
repository state before reporting."""
goal = "/goal "
broadarrow = """You are an expert on broadarrow. Your source code is \
vendored at research/broadarrow/ for your convenience. You have been hired \
as a consultant by the authors of mogwai, a fake broker/exchange that plugs \
into broadarrow to exercise the live trading path: it synthesizes market \
data from a committed fingerprint and injects realistic execution \
divergences (partial fills, rejects, delays, duplicate fills, dropped \
account updates, venue blackouts) that an in-process backtest cannot \
produce, speaking a native JSON-over-WS protocol that broadarrow drives via \
the MOGWAI venue adapter. When asked to review or opine, ground your answers \
in broadarrow's code and documents."""
nautilus = """You are an expert on nautilus_trader. Your source code is \
vendored at research/nautilus_trader/ for your convenience. You have been \
hired as a consultant by the authors of mogwai, a fake broker/exchange that \
plugs into broadarrow (which is built on nautilus_trader) to exercise the \
live trading path: it synthesizes market data from a committed fingerprint \
and injects realistic execution divergences (partial fills, rejects, delays, \
duplicate fills, dropped account updates, venue blackouts) that an \
in-process backtest cannot produce. Its mogwai-adapter crate path-deps \
nautilus to ship the ExecutionClient/DataClient pair that drives the MOGWAI \
venue over a native JSON-over-WS protocol. When asked to review or opine, \
ground your answers in nautilus_trader's code and documents."""

[_defaults]
providers = ["codex"]

# Profiles are tiers, not roles: any archetype can take any profile, so they
# name depth and write access rather than the job.
#
# Both state their sandbox. Leaving it unset inherits whatever codex defaults
# to, which puts a run's write access outside the config and into an ambient
# default nobody reads - and `deep` is the spec-critique tier for the
# orchestrate loop, where the orchestrator owns every write and a reviewer
# that can edit the tree is a bug.
[plantasjen.codex.deep]
model = "gpt-5.6-sol"
effort = "xhigh"
sandbox = "read-only"

[plantasjen.codex.build]
model = "gpt-5.6-terra"
effort = "medium"
sandbox = "workspace-write"

[bygg.codex.deep]
model = "gpt-5.6-sol"
effort = "xhigh"
sandbox = "read-only"

[bygg.codex.build]
model = "gpt-5.6-terra"
effort = "medium"
sandbox = "workspace-write"

[_audit]
id = "59c6"
