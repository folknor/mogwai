[project]
name = "tape-v2"
version = "0.1.0"
description = "Synthetic tape v2: corpus indexing, fitting experiments and validation against the Databento GLBX corpus"
readme = "README.md"
authors = [
    { name = "folk", email = "folk@folk.wtf" }
]
requires-python = ">=3.12"
dependencies = [
    "databento>=0.86.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
tape-v2 = "tape_v2:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
